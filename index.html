let D={recs:[],opds:[],abbr:'halteng=halmahera tengah\nhalsel=halmahera selatan\nhalut=halmahera utara\nhalbar=halmahera barat\nhaltim=halmahera timur\ntikep=tidore kepulauan\nmalut=maluku utara',meta:{prov:'Maluku Utara',ibu:'Sofifi',url:'',secret:'',who:''}},S={tab:'beranda',opd:'',q:'',f:'',p:0},syncing=0,MAP=null,MT=null;

/* ---------- kode & referensi (dari sheet PARAMETER contoh) ---------- */
const KD=[['1.1','Dalam Penguasaan - Tidak Glondong'],['1.2','Dalam Penguasaan - Glondong'],['1.3','Ada di OPD Lain dg Suket/BA'],['1.4','Ada di OPD Lain Tanpa Suket/BA'],['1.5','Ada di Instansi Lain dg Suket/BA'],['1.6','Ada di Instansi Lain Tanpa Suket/BA'],['1.7','Ada di Pihak III dg Suket/BA'],['1.8','Ada di Pihak III Tanpa Suket/BA'],['1.9','Usulan u/ Dihibahkan'],['1.10','Usulan u/ Diserahkan kpd Masy./Kel'],['1.11','Usulan u/ Dihapuskan'],['1.12','Aset Induk ada di OPD Lain/Kapital'],['1.13','Usulkan u Mutasi ke OPD/UPB Lain'],['2.1','Barang Sudah Dihapuskan/Lelang/Dijual'],['2.2','Barang Sudah Dihibahkan/Diberikan'],['2.3','Barang Hilang dg Suket/BA/Ket. Lain'],['2.4','Barang Hilang Tanpa Suket/BA/Ket. Lain'],['2.5','Double Pencatatan'],['2.6','Hilang/Musnah Terkena Bencana'],['2.7','Kesalahan Pencatatan'],['3.1','Barang Belum Diketemukan/Masih Dalam Pencarian']],KDL=Object.fromEntries(KD);
const SBT=['Kapitalisasi','Kapitalisasi dari OPD Lain','Mutasi dari OPD lain','Rincian Dari Aset Glondong','Hibah'],SBK=['Dikapitalisasi ke Aset Induk','Dikapitalisasi ke Aset Di OPD lain','Mutasi ke OPD Lain','Aset Glondong untuk dirincikan','Dihibahkan'],YT=['','YA','TIDAK'];
const FB=[['nama','Nama barang','text'],['kode','Kode barang','text'],['reg','No. register','text'],['alamat','Alamat/lokasi','text'],['tgl','Tgl perolehan','date'],['jml','Jumlah bangunan','number'],['harga','Harga (Rp)','number'],['luas','Luas sesuai KIB (m²)','number']];
const F1=[['ada','Keberadaan',['','ADA','TIDAK','BELUM']],['bert','Bertingkat',YT],['beton','Beton',YT],['kond','Kondisi',['','B','KB','RB']],['guna','Penggunaan',YT],['kuasa','Penguasaan',YT],['jmlLap','Jumlah unit di lapangan','number'],['luasUkur','Luas hasil pengukuran (m²)','number'],['rehab','Bangunan rehab',YT],['kap','Kapitalisasi ke aset induk',YT],['indukLain','Aset induk di OPD lain',YT],['reff','No. urut reff aset induk','text'],['kd','Kode inventarisasi',[''].concat(KD)],['y','Aset induk di OPD/UPB lain atau mutasi ke OPD/UPB lain','text'],['ket','Keterangan','text']];
const fld=(f,v)=>{const[k,l,t]=f;return `<label>${l}`+(Array.isArray(t)?`<select name="${k}">${t.map(o=>{const[a,b]=Array.isArray(o)?[o[0],o[0]+' '+o[1]]:[o,o];return `<option value="${esc(a)}"${a==v?' selected':''}>${esc(b||'—')}</option>`}).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(v)}"${t=='number'?' step="any" inputmode="decimal"':''}>`)+'</label>'};
const CP=r=>({kib:r.kib,nama:r.nama,kode:r.kode,reg:r.reg,alamat:r.alamat,tgl:r.tgl,jml:r.jml,harga:r.harga,luas:r.luas,kond:r.kond,bert:r.bert,beton:r.beton,guna:r.guna,kuasa:r.kuasa,jmlLap:r.jmlLap,luasUkur:r.luasUkur});
/* ---------- normalisasi & pengelompokan instansi ---------- */
let ABR=[];const mkAbr=()=>{ABR=[...D.abbr.split('\n').map(l=>l.split('=')),['sma negeri','sman'],['sma n','sman'],['smp negeri','smpn'],['smk negeri','smkn'],['sd negeri','sdn']].filter(a=>a[1]).map(([a,b])=>[new RegExp('(?<![a-z0-9])'+a.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'')+'(?![a-z0-9])','g'),b.trim().toLowerCase()])};
const norm=s=>{s=String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/([a-z])(\d)/g,'$1 $2');ABR.forEach(([a,b])=>s=s.replace(a,b));return s.replace(/\s+/g,' ').trim()};
async function grup(all){let ch=[];const P=D.opds.map(o=>({n:o.name,k:(o.keys||[]).map(norm).filter(Boolean).map(k=>new RegExp('(?<![a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![0-9])'))}));
 V().forEach(r=>{if(r.st!='c01'||r.lock||(r.opd&&!all))return;const T=[[norm(r.nama),3],[norm(r.alamat),2],[norm(r.y),3],[norm(r.ket),1]];let b='',bs=0;P.forEach(p=>{let s=0;p.k.forEach(re=>T.forEach(([t,w])=>{if(re.test(t))s+=w}));if(s>bs){bs=s;b=p.n}});if(b!==r.opd){r.opd=b;ch.push(r)}});
 if(ch.length)await saveMany(ch);return ch.length}

function vHome(){const c=V().filter(r=>r.st=='c01'),n=c.filter(r=>!r.opd).length;
 $('#v').innerHTML=`<div class="pn"><h3 style="margin-top:0">Alur kerja</h3><ol><li><b>Import</b> kertas kerja induk (Excel) atau ketik manual.</li><li><b>Kelompokkan</b> per instansi berdasarkan kata kunci (tab Instansi).</li><li>Turun lapangan: isi <b>C-01</b>, foto bertimestamp, titik GPS. Aset baru → <b>C-02</b>; tidak ditemukan → <b>C-03</b>; salah catat → tombol <b>Mutasi</b> (tinjau dulu).</li><li>Tab <b>Peta</b>: citra satelit, tandai bangunan, Google Earth, cetak denah.</li><li>Tab <b>Hasil</b>: unduh Excel KKI (C-01, C-02, C-03, C-Hasil, foto).</li></ol>
 <div class="row"><button class="b p" data-a="imp">Import Excel induk</button><button class="b" data-a="new" data-st="c01">+ Data manual</button><button class="b" data-a="regrup">Kelompokkan ulang</button></div>

A.so_save=async t=>{const d=fd();if(!d.name.trim())return toast('Nama instansi wajib diisi','w');d.name=d.name.trim();d.keys=d.keys.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);if(!d.keys.length)d.keys=[d.name];const i=D.opds.findIndex(x=>x.name==t.dataset.n);
 if(i<0)D.opds.push(d);else{const old=D.opds[i].name;D.opds[i]=d;if(old!=d.name){const ch=V().filter(r=>r.opd==old);ch.forEach(r=>r.opd=d.name);await saveMany(ch)}}await kv('opds',D.opds);A.close();render()};

 $('#q').oninput=e=>{S.q=e.target.value;S.p=0;clearTimeout(vList.t);vList.t=setTimeout(()=>lst(st),200)};if($('#f')){$('#f').value=S.f;$('#f').onchange=e=>{S.f=e.target.value;S.p=0;lst(st)}}lst(st)}

async function impCtl(f){await js(XJS);const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),nm=n=>wb.SheetNames.find(s=>s.trim().toLowerCase()==n),pg=nm('progres'),jd=nm('jadwal mingguan');if(!pg)throw new Error('Sheet "Progres" tidak ditemukan di file ini');
 const M=ctlMap(),out=[];let nO=0;const get=n=>{n=n.trim();let o=D.opds.find(x=>norm(x.name)==norm(n));if(!o){o={name:n,keys:[n]};D.opds.push(o);nO++}return o.name},rec=n=>{let r=M.get(n);if(!r){r={id:'ctl:'+n,st:'ctl',opd:n};M.set(n,r)}if(!out.includes(r))out.push(r);return r},sv=v=>{v=tx_(v).toUpperCase();return STS.includes(v)?v:''},nz=v=>typeof v=='number'?v:'';
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[pg],{header:1,raw:true,defval:''});
 for(let i=10;i<rows.length;i++){const r=rows[i],u=tx_(r[1]);if(!u||/^jumlah/i.test(u)||r[0]===''||isNaN(+r[0]))continue;const c=rec(get(u));Object.assign(c,{tim:tx_(r[2]),jt:sv(r[3]),pj:tx_(r[27])||c.pj||'',rT:nz(r[17]),rB:nz(r[18]),rK:nz(r[19]),sT:nz(r[20]),sB:nz(r[21]),sK:nz(r[22]),final:nz(r[16])});[['tl',4],['in',7],['dn',10],['ft',13]].forEach(([k,j])=>KB.forEach((b,x)=>c[k+b]=sv(r[j+x])))}
 const np=out.length;
 if(jd){const a=XLSX.utils.sheet_to_json(wb.Sheets[jd],{header:1,raw:true,defval:''}),hr=a.findIndex(r=>r.some(x=>tx_(x)=='TANGGAL'));(a[hr]||[]).forEach((h,c)=>{if(tx_(h)!='TANGGAL')return;let d='';for(let i=hr+1;i<a.length;i++){const r=a[i],u=tx_(r[c+1]);if(r[c] instanceof Date)d=iso(r[c]);if(!u||!d||typeof r[c+1]!='string')continue;const x=rec(get(u)),tm=[6,7,8].map(j=>tx_(r[c+j])).find(s=>/^tim/i.test(s));if(!x.tgl||d<x.tgl){x.tgl=d;x.kj=x.kj||tx_(r[c+2]);x.lokasi=tx_(r[c+3]);if(tm)x.tj=tm}}})}
 await saveMany(out);await kv('opds',D.opds);mkAbr();toast(`Controlling: ${np} instansi dari Progres, ${out.length-np} dari jadwal saja, ${nO} instansi baru ditambahkan`,'ok',9000);render()}
A.cxl=()=>busy('Menyusun Excel controlling…',async()=>{await js(EXJS);const W=new ExcelJS.Workbook(),ws=W.addWorksheet('Progres',{views:[{state:'frozen',ySplit:1,xSplit:2}]}),C=ctlAll(),H=['NO','UPB','TIM','JADWAL TURLAP','TURLAP KIB A','TURLAP KIB C','TURLAP KIB F','INPUT KKI EXCEL KIB A','INPUT KKI EXCEL KIB C','INPUT KKI EXCEL KIB F','KKI DENAH KIB A','KKI DENAH KIB C','KKI DENAH KIB F','KKI FOTO KIB A','KKI FOTO KIB C','KKI FOTO KIB F','KKI FINAL','REGISTER TANAH','REGISTER BANGUNAN','REGISTER KDP','SUDAH TANAH','SUDAH BANGUNAN','SUDAH KDP','STATUS (SISA)','TANAH (%)','BANGUNAN (%)','KDP (%)','PJ','TGL TURLAP','LOKASI'];
 ws.addRow(H);ws.getRow(1).font={bold:true};ws.getRow(1).alignment={wrapText:true,vertical:'middle',horizontal:'center'};ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E8EC'}};H.forEach((_,i)=>ws.getColumn(i+1).width=i==1?42:i==2?20:11);
 const FC={SUDAH:'FFC6EFCE',PROSES:'FFFFEB9C',BELUM:'FFFFC7CE'},pf=(a,s,r)=>({formula:`IF(AND(${a}${r}=0,${s}${r}=0),"-",IFERROR(${s}${r}/${a}${r},0))`});
 C.forEach((c,i)=>{const r=i+2,row=ws.addRow([i+1,c.opd,c.tim||'',c.jt||'',...['tl','in','dn','ft'].flatMap(k=>KB.map(b=>c[k+b]||'')),c.final??'',c.rT??0,c.rB??0,c.rK??0,c.sT??0,c.sB??0,c.sK??0,{formula:`SUM(R${r}:T${r})-SUM(U${r}:W${r})`},pf('R','U',r),pf('S','V',r),pf('T','W',r),c.pj||'',c.tgl?new Date(c.tgl+'T00:00:00Z'):null,c.lokasi||'']);
  for(let j=4;j<=16;j++){const f=FC[row.getCell(j).value];if(f)row.getCell(j).fill={type:'pattern',pattern:'solid',fgColor:{argb:f}}}[25,26,27].forEach(j=>row.getCell(j).numFmt='0%');row.getCell(29).numFmt='dd/mm/yyyy'});
 const b=await W.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='CONTROLLING_INVENTARISASI_ASET.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Excel controlling selesai dibuat','ok')});
/* ---------- mulai ---------- */
(async()=>{const[recs,k]=await Promise.all([all('recs'),all('kv')]);D.recs=recs;k.forEach(x=>{if(x.k=='opds')D.opds=x.v;else if(x.k=='abbr')D.abbr=x.v;else if(x.k=='meta')Object.assign(D.meta,x.v);else if(x.k=='last')S.opd=x.v});mkAbr();updNet();upQ();render();sync();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
