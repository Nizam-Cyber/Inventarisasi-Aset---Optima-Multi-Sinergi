<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>Inventarisasi Aset</title>
<style>
:root{
  --bg:#f1f5f9;--sf:#fff;--ink:#0f172a;--mu:#64748b;--ln:#e2e8f0;
  --pr:#0d9488;--pr2:#0f766e;--pi:#fff;--ok:#10b981;--er:#ef4444;--wa:#f59e0b;
  --sh:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shg:0 10px 25px -5px rgba(15,23,42,.08);
  --r:12px;--hh:60px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f172a;--sf:#1e293b;--ink:#e2e8f0;--mu:#94a3b8;--ln:#334155;
  --pr:#2dd4bf;--pr2:#14b8a6;--pi:#042f2e;
}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(13,148,136,.92);backdrop-filter:blur(12px);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.brand-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#fb923c,#f97316);display:grid;place-items:center;font-weight:900;font-size:11px;letter-spacing:.5px;color:#fff;box-shadow:0 4px 12px rgba(251,146,60,.4);flex-shrink:0}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{opacity:.85;font-size:11.5px}
.chip{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap;background:rgba(255,255,255,.1)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:5px}
.chip.off .dot{background:#f87171}

/* layout */
.layout{display:flex;min-height:calc(100vh - var(--hh))}
aside{display:none;width:220px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--ln);padding:12px 8px;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto}
aside button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 14px;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;text-align:left;border-radius:9px;margin-bottom:2px;cursor:pointer;transition:background .15s}
aside button:hover{background:var(--bg)}
aside button.on{background:color-mix(in srgb,var(--pr) 15%,transparent);color:var(--pr)}
aside button .ic{width:20px;text-align:center;font-size:15px}
main{flex:1;min-width:0;padding:14px;max-width:1100px;margin:0 auto;width:100%}

/* nav mobile */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;overflow-x:auto;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.04)}
nav button{flex:1;min-width:62px;padding:9px 4px 8px;border:0;background:none;color:var(--mu);font-weight:600;font-size:11px;border-top:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:17px}
nav button.on{color:var(--pr);border-top-color:var(--pr)}

@media(min-width:900px){
  body{padding-bottom:0}
  aside{display:block}
  nav{display:none}
}

/* cards */
.pn,.cd{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.cd{cursor:pointer;transition:transform .1s,box-shadow .15s}
.cd:hover{box-shadow:var(--shg);transform:translateY(-1px)}
.cd small,.mu{color:var(--mu);display:block;font-size:12.5px;margin-top:2px}
h3{margin:0 0 12px;font-size:16px}
h4{margin:14px 0 8px;font-size:14px;color:var(--mu)}

/* forms */
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px;margin:9px 0}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
textarea{resize:vertical;min-height:60px}

/* buttons */
.b{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;font:inherit;transition:all .15s;white-space:nowrap}
.b:hover{background:var(--bg)}
.b.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--pi);border-color:transparent;box-shadow:0 2px 6px color-mix(in srgb,var(--pr) 40%,transparent)}
.b.p:hover{filter:brightness(1.08)}
.b.d{color:var(--er);border-color:color-mix(in srgb,var(--er) 40%,transparent)}
.b.sm{padding:5px 10px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>select,.row>input{flex:1;min-width:140px;width:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}

/* chips */
.ch{font-style:normal;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);margin:3px 4px 0 0;display:inline-block;color:var(--mu)}
.ch.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.ch.er{color:var(--er);border-color:var(--er);background:color-mix(in srgb,var(--er) 10%,transparent)}
.ch.wa{color:var(--wa);border-color:var(--wa);background:color-mix(in srgb,var(--wa) 10%,transparent)}

/* loading & toast */
#ld{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#fff}
.sp{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#ts{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.t{padding:11px 15px;border-radius:10px;background:#0f172a;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .2s;font-size:14px}
.t.ok{background:var(--ok)}.t.e{background:var(--er)}.t.w{background:#b45309}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* dialog */
dialog{width:min(680px,96vw);max-height:92vh;border:0;border-radius:14px;background:var(--sf);color:var(--ink);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
dialog h3{margin-bottom:12px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--ln);padding:6px 9px;text-align:left}
th{background:var(--bg);font-weight:600}

/* thumb */
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.th img{width:76px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}

/* map */
#mw{position:relative}#map{height:62vh;border-radius:12px;border:1px solid var(--ln)}
#nA{position:absolute;right:12px;top:12px;z-index:500;background:rgba(255,255,255,.92);color:#000;border-radius:50%;width:46px;height:46px;text-align:center;font-weight:800;line-height:1.05;padding-top:5px;box-shadow:var(--sh)}
.mk b{display:block;background:#e4572e;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:24px;font-size:12px}

/* misc */
.pb{height:7px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:var(--ok);border-radius:0;padding:0;border:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tabs button{padding:7px 14px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--pr);color:var(--pi);border-color:var(--pr)}
.kib-sel{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.kib-sel button{flex:1;min-width:70px;padding:10px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.kib-sel button.on{background:var(--pr);color:var(--pi);border-color:var(--pr);box-shadow:0 2px 8px color-mix(in srgb,var(--pr) 40%,transparent)}
footer{text-align:center;padding:16px;color:var(--mu);font-size:12px;border-top:1px solid var(--ln);margin-top:20px}
.empty{text-align:center;padding:32px;color:var(--mu)}
.logo-preview{max-height:60px;max-width:140px;object-fit:contain;border:1px dashed var(--ln);border-radius:8px;padding:4px;background:var(--bg)}

@media print{header,nav,aside,footer,.bar,.row,#hint,#ts{display:none!important}body{padding:0;background:#fff}#map{height:70vh}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo" id="lgOpt">OPTIMA</div>
    <div class="brand-text">
      <b id="appTitle">Inventarisasi Aset</b>
      <small id="appSub">Sistem Inventarisasi BMD</small>
    </div>
  </div>
  <span class="chip" id="net"></span>
  <span class="chip" id="qc"></span>
</header>

<div class="layout">
  <aside id="side"></aside>
  <main id="v"></main>
</div>

<nav id="nav"></nav>
<footer>Made by Nizam Zamami © 2026</footer>

<div id="ld" hidden><div class="sp"></div><b id="ldt">Memproses…</b></div>
<div id="ts"></div>
<dialog id="dlg"></dialog>

<input type="file" id="fi" hidden accept=".xlsx,.xlsm">
<input type="file" id="fk" hidden accept=".xlsx,.xlsm">
<input type="file" id="fc" hidden accept="image/*" capture="environment">
<input type="file" id="fg" hidden accept="image/*">
<input type="file" id="fl" hidden accept="image/*">

<script>
'use strict';
/* ======================= KONSTANTA ======================= */
const XJS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      EXJS='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
      LJS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
      LCSS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';

const KIB_META={
  A:{n:'Tanah',c:'#10b981'},B:{n:'Peralatan dan Mesin',c:'#3b82f6'},
  C:{n:'Bangunan dan Gedung',c:'#f59e0b'},D:{n:'Jalan, Irigasi, dan Jaringan',c:'#8b5cf6'},
  E:{n:'Aset Tetap Lainnya',c:'#ec4899'},F:{n:'Konstruksi Dalam Pengerjaan',c:'#14b8a6'}
};

const KD=[
  ['1.1','Dalam Penguasaan - Tidak Glondong'],['1.2','Dalam Penguasaan - Glondong'],
  ['1.3','Ada di OPD Lain dg Suket/BA'],['1.4','Ada di OPD Lain Tanpa Suket/BA'],
  ['1.5','Ada di Instansi Lain dg Suket/BA'],['1.6','Ada di Instansi Lain Tanpa Suket/BA'],
  ['1.7','Ada di Pihak III dg Suket/BA'],['1.8','Ada di Pihak III Tanpa Suket/BA'],
  ['1.9','Usulan u/ Dihibahkan'],['1.10','Usulan u/ Diserahkan kpd Masy./Kel'],
  ['1.11','Usulan u/ Dihapuskan'],['1.12','Aset Induk ada di OPD Lain'],
  ['1.13','Usulkan u Mutasi ke OPD/UPB Lain'],
  ['2.1','Barang Sudah Dihapuskan/Lelang/Dijual'],['2.2','Barang Sudah Dihibahkan'],
  ['2.3','Barang Hilang dg Suket/BA'],['2.4','Barang Hilang Tanpa Suket/BA'],
  ['2.5','Double Pencatatan'],['2.6','Hilang/Musnah Terkena Bencana'],
  ['2.7','Kesalahan Pencatatan'],['3.1','Barang Belum Diketemukan']
];
const KDL=Object.fromEntries(KD);

const SBT=['Kapitalisasi','Kapitalisasi dari OPD Lain','Mutasi dari OPD lain','Rincian Dari Aset Glondong','Hibah'];
const SBK=['Dikapitalisasi ke Aset Induk','Dikapitalisasi ke Aset Di OPD lain','Mutasi ke OPD Lain','Aset Glondong untuk dirincikan','Dihibahkan'];

/* ======================= FIELD PER KIB ======================= */
/* Setiap KIB punya field dasar (kode, nama, reg, alamat, tgl, harga) + field khusus */
const COMMON=[['kode','Kode Barang','text'],['nama','Nama Barang','text'],['reg','No. Register','text'],['alamat','Alamat/Lokasi','text'],['tgl','Tgl Perolehan','date'],['harga','Harga (Rp)','number']];
const FIELDS={
  A:[...COMMON,
    ['luas','Luas (m²)','number'],['hak','Hak/Sertifikat',['','SHM','HGB','HPL','HP','Girik','Lainnya']],
    ['guna','Penggunaan',['','Bangunan','Pertanian','Jalan','Lainnya']],
    ['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['ket','Keterangan','text']],
  B:[...COMMON,
    ['merk','Merk/Type','text'],['ukuran','Ukuran','text'],['satuan','Satuan','text'],
    ['jml','Jumlah','number'],['kond','Kondisi',['','B','KB','RB']],
    ['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['ket','Keterangan','text']],
  C:[...COMMON,
    ['luas','Luas sesuai KIB (m²)','number'],['jml','Jumlah Bangunan','number'],
    ['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['bert','Bertingkat',['','YA','TIDAK']],['beton','Beton',['','YA','TIDAK']],
    ['kond','Kondisi',['','B','KB','RB']],['guna','Penggunaan',['','YA','TIDAK']],
    ['kuasa','Penguasaan',['','YA','TIDAK']],
    ['jmlLap','Jumlah unit di lapangan','number'],['luasUkur','Luas hasil ukur (m²)','number'],
    ['rehab','Bangunan rehab',['','YA','TIDAK']],['kap','Kapitalisasi ke induk',['','YA','TIDAK']],
    ['indukLain','Aset induk di OPD lain',['','YA','TIDAK']],['reff','Reff induk','text'],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['y','Aset induk / mutasi OPD lain','text'],['ket','Keterangan','text']],
  D:[...COMMON,
    ['konstruksi','Konstruksi',['','Beton','Aspal','Kerikil','Tanah','Lainnya']],
    ['panjang','Panjang (m)','number'],['lebar','Lebar (m)','number'],['luas','Luas (m²)','number'],
    ['kond','Kondisi',['','B','KB','RB']],['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['ket','Keterangan','text']],
  E:[...COMMON,
    ['merk','Merk/Type','text'],['ukuran','Ukuran','text'],['jml','Jumlah','number'],
    ['kond','Kondisi',['','B','KB','RB']],['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['ket','Keterangan','text']],
  F:[...COMMON,
    ['kontrak','No. Kontrak','text'],['nilai','Nilai Kontrak (Rp)','number'],
    ['progress','Progress (%)','number'],['mulai','Tgl Mulai','date'],['selesai','Tgl Selesai','date'],
    ['ada','Keberadaan',['','ADA','TIDAK','BELUM']],
    ['kd','Kode Inventarisasi',[''].concat(KD)],['ket','Keterangan','text']]
};

/* Kolom template import per KIB (harus cocok dengan parser) */
const TPL={
  A:['NO','KODE BARANG','NAMA BARANG','NO REG','ALAMAT','LUAS','HAK','PENGGUNAAN','TGL PEROLEHAN','HARGA','KETERANGAN'],
  B:['NO','KODE BARANG','NAMA BARANG','NO REG','MERK/TYPE','UKURAN','SATUAN','JUMLAH','TGL PEROLEHAN','HARGA','KONDISI','ALAMAT','KETERANGAN'],
  C:['NO','KODE BARANG','NAMA BARANG','NO REG','ALAMAT/LOKASI','LUAS BANG. SESUAI KIB','TGL PEROLEHAN','JUMLAH BANG','HARGA','KEBERADAAN','BERTINGKAT','BETON','KONDISI','PENGGUNAAN','PENGUASAAN','JUMLAH UNIT','LUAS HASIL UKUR','REHAB','KAPITALISASI','INDUK OPD LAIN','REFF','KD INVENT','KD JNS','KET INVENT','ASET INDUK/MUTASI','KETERANGAN'],
  D:['NO','KODE BARANG','NAMA BARANG','NO REG','KONSTRUKSI','PANJANG','LEBAR','LUAS','ALAMAT','TGL PEROLEHAN','HARGA','KONDISI','KETERANGAN'],
  E:['NO','KODE BARANG','NAMA BARANG','NO REG','MERK/TYPE','UKURAN','JUMLAH','ALAMAT','TGL PEROLEHAN','HARGA','KONDISI','KETERANGAN'],
  F:['NO','KODE BARANG','NAMA BARANG','NO REG','NO KONTRAK','NILAI KONTRAK','PROGRESS','TGL MULAI','TGL SELESAI','ALAMAT','HARGA','KETERANGAN']
};

/* ======================= STATE & DB ======================= */
const D={
  recs:[],opds:[],abbr:'halteng=halmahera tengah\nhalsel=halmahera selatan\nhalut=halmahera utara\nhalbar=halmahera barat\nhaltim=halmahera timur\ntikep=tidore kepulauan\nmalut=maluku utara\nsman=sma negeri\nsmpn=smp negeri\nsmkn=smk negeri\nsdn=sd negeri',
  meta:{
    project:'',prov:'Maluku Utara',ibu:'Sofifi',url:'',secret:'',who:'',
    kop1:'PEMERINTAH PROVINSI MALUKU UTARA',kop2:'BADAN PENGELOLA KEUANGAN DAN ASET DAERAH',
    kop3:'Jl. ...',kop4:'',logoOpt:'',logoProv:'',logoKab:''
  }
};
const S={tab:'beranda',kib:'C',st:'01',opd:'',q:'',f:'',p:0};
let MAP=null,MT=null,PR=null,syncing=0;

const DB=new Promise((ok,no)=>{
  const r=indexedDB.open('inv',2);
  r.onupgradeneeded=()=>{const d=r.result;['recs','kv','ph','q'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s=='kv'?'k':'id'})})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),rq=f(t.objectStore(s));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error)})};
const put=(s,o)=>tx(s,'readwrite',x=>x.put(o)),all=s=>tx(s,'readonly',x=>x.getAll()),
      putMany=(s,a)=>tx(s,'readwrite',x=>a.forEach(o=>x.put(o))),
      kv=(k,v)=>put('kv',{k,v});

/* ======================= UTIL ======================= */
const $=s=>document.querySelector(s),
      esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
      uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      cur=()=>S.opd=='__'?'':S.opd,
      by=id=>D.recs.find(r=>r.id===id),
      V=()=>D.recs.filter(r=>!r.del),
      rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');

function toast(m,t='i',ms=5000){const e=document.createElement('div');e.className='t '+t;e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),ms)}
async function busy(t,f){$('#ldt').textContent=t;$('#ld').hidden=false;await new Promise(r=>setTimeout(r,30));try{return await f()}catch(e){toast(e.message||String(e),'e',8000)}finally{$('#ld').hidden=true}}

const JS={};
const js=u=>JS[u]||(JS[u]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{delete JS[u];no(new Error('Pustaka gagal dimuat — sambungkan internet sekali, setelah itu tersimpan untuk offline'))};document.head.append(s)}));

const A={};
const modal=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()};
const fd=()=>Object.fromEntries(new FormData($('#fm')));
A.close=()=>$('#dlg').close();
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t,e)});
const updNet=()=>{const n=$('#net');if(!n)return;n.className='chip'+(navigator.onLine?'':' off');n.innerHTML='<span class="dot"></span>'+(navigator.onLine?'Online':'Offline')};
addEventListener('online',()=>{updNet();toast('Online kembali — mengirim data tertunda…');sync()});
addEventListener('offline',()=>{updNet();toast('Offline — data aman di perangkat','w')});

/* abbr & normalisasi */
let ABR=[];
const mkAbr=()=>{ABR=[...D.abbr.split('\n').map(l=>l.split('=')),['sma negeri','sman'],['sma n','sman'],['smp negeri','smpn'],['smk negeri','smkn'],['sd negeri','sdn']].filter(a=>a[1]).map(([a,b])=>[new RegExp('(?<![a-z0-9])'+a.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'')+'(?![a-z0-9])','g'),b.trim().toLowerCase()])};
const norm=s=>{s=String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/([a-z])(\d)/g,'$1 $2');ABR.forEach(([a,b])=>s=s.replace(a,b));return s.replace(/\s+/g,' ').trim()};

function sel(){return `<select id="so"><option value="">— pilih instansi —</option><option value="__"${S.opd=='__'?' selected':''}>(Belum terkelompok)</option>${D.opds.map(o=>`<option${o.name==S.opd?' selected':''}>${esc(o.name)}</option>`).join('')}</select>`}
document.addEventListener('change',e=>{if(e.target.id=='so'){S.opd=e.target.value;S.p=0;kv('last',S.opd);render()}});

function lst(st){
  if(!S.opd){$('#lst').innerHTML='<p class="mu">Pilih instansi dulu.</p>';$('#pg').innerHTML='';return}
  let a=V().filter(r=>r.st==st&&r.opd===cur()&&r.kib===S.kib);
  if(S.q){const q=norm(S.q);a=a.filter(r=>norm([r.nama,r.alamat,r.reg,r.kode,r.ket].join(' ')).includes(q))}
  if(S.f)a=a.filter(r=>S.f=='belum'?(!r.ada||r.ada=='BELUM')&&!r.mut:S.f=='mut'?r.mut:r.ada==S.f);
  a.sort((x,y)=>(x.no||1e9)-(y.no||1e9));
  const N=40,pg=Math.ceil(a.length/N)||1;S.p=Math.min(S.p,pg-1);
  const ch=(t,c)=>`<i class="ch ${c}">${esc(t)}</i>`;
  $('#lst').innerHTML=a.slice(S.p*N,S.p*N+N).map(r=>`<div class="cd" data-a="edit" data-id="${r.id}">
    <b>${r.no?r.no+'. ':''}${esc(r.nama)}</b>
    <small>${esc(r.kode||'')} · Reg ${esc(r.reg||'')} · ${esc(r.tgl||'')} · ${rp(r.harga)}</small>
    <small>${esc(r.alamat||'')}</small>
    ${r.mut?ch('Dimutasi','wa'):r.ada=='ADA'?ch('Ada','ok'):r.ada=='TIDAK'?ch('Tidak ada','er'):st=='01'?ch('Belum','wa'):''}
    ${r.kond?ch('Kondisi '+r.kond,''):''}${r.lat?ch('GPS','ok'):''}${r.sebab?ch(r.sebab,''):''}
  </div>`).join('')||'<p class="empty">Belum ada data. Import template atau tambah manual.</p>';
  $('#pg').innerHTML=`<button class="b" data-a="pp" data-d="-1">‹</button><span class="mu">${a.length} baris · hal ${S.p+1}/${pg}</span><button class="b" data-a="pp" data-d="1">›</button>`;
  $('#pg').dataset.max=pg;
}
A.pp=t=>{S.p=Math.max(0,Math.min(+$('#pg').dataset.max-1,S.p+ +t.dataset.d));lst('0'+S.st);scrollTo(0,0)};

async function edit(id){
  const r=by(id);if(!r)return;
  const ph=(await all('ph')).filter(p=>p.rid==id);
  const base=FIELDS[r.kib]||FIELDS.C;
  let extra=[];
  if(r.st==='02')extra=[['sebab','Sebab bertambah',[''].concat(SBT)],['asal','Asal OPD','text']];
  if(r.st==='03')extra=[['sebab','Sebab berkurang',[''].concat(SBK)],['tujuan','Tujuan OPD','text']];
  const F=[...base,...extra];
  modal(`<form id="fm">
    <h3>${esc(r.nama)}</h3>
    <small class="mu">${esc(r.kode||'')} · Reg ${esc(r.reg||'')} · ${rp(r.harga)}</small>
    <div class="th">${ph.map(p=>`<img src="${URL.createObjectURL(p.blob)}" alt="">`).join('')}</div>
    <div class="row"><button type="button" class="b" data-a="foto" data-id="${id}">📷 Foto + Timestamp</button>
    <button type="button" class="b" data-a="lamp" data-id="${id}">🖼 Lampirkan Foto</button>
    <button type="button" class="b" data-a="gps" data-id="${id}">📍 GPS${r.lat?' ✓':''}</button></div>
    ${r.st==='01'?`<label>Instansi<select name="opd">${D.opds.map(o=>`<option${o.name==r.opd?' selected':''}>${esc(o.name)}</option>`).join('')}</select></label>`:''}
    ${F.map(f=>fld(f,r[f[0]]??'')).join('')}
    <div class="row">
      <button type="button" class="b p" data-a="esave" data-id="${id}">💾 Simpan</button>
      ${r.st==='01'&&!r.mut?`<button type="button" class="b" data-a="mut" data-id="${id}">↔ Mutasi ke…</button>`:''}
      ${r.mut?`<button type="button" class="b" data-a="undo" data-id="${id}">↺ Batalkan mutasi</button>`:''}
      ${(r.st==='02'||r.st==='03')?`<button type="button" class="b d" data-a="del" data-id="${id}">🗑 Hapus</button>`:''}
      <button type="button" class="b" data-a="close">Tutup</button>
    </div></form>`);
}
A.edit=t=>edit(t.dataset.id);

const fld=(f,v)=>{
  const [k,l,t]=f;
  if(Array.isArray(t))return `<label>${l}<select name="${k}">${t.map(o=>{const[a,b]=Array.isArray(o)?[o[0],o[0]+' '+o[1]]:[o,o];return `<option value="${esc(a)}"${a==v?' selected':''}>${esc(b||'—')}</option>`}).join('')}</select></label>`;
  return `<label>${l}<input name="${k}" type="${t}" value="${esc(v)}"${t==='number'?' step="any" inputmode="decimal"':''}></label>`;
};

A.esave=async t=>{
  const r=by(t.dataset.id),d=fd();
  if(r.st==='01'&&d.ada==='TIDAK'&&!String(d.kd||'').startsWith('2'))return toast('Barang tidak ditemukan → pilih Kode Inventarisasi 2.x','w',7000);
  if(d.opd){r.lock=d.opd!=r.opd||r.lock;Object.assign(r,d)}
  else Object.assign(r,d);
  await save(r);
  if(r.kib==='C'&&r.st==='01')await syncC03(r);
  A.close();lst('0'+S.st);
};
async function syncC03(r){
  const L=V().find(x=>x.st==='03'&&x.link===r.id);
  if(r.ada==='TIDAK'){
    const o={...CP(r),sebab:KDL[r.kd]||'',tujuan:'-',reff:r.no,km:'Tidak ditemukan: '+(KDL[r.kd]||''),ket:r.ket||r.nama,opd:r.opd,kib:r.kib};
    if(L){Object.assign(L,o);await save(L)}else await save({id:uid(),st:'03',link:r.id,kib:r.kib,...o});
  } else if(L){L.del=1;await save(L)}
}
const CP=r=>{const o={};['kib','nama','kode','reg','alamat','tgl','harga','kond','luas','jml','ada'].forEach(k=>o[k]=r[k]);return o};

A.del=async t=>{if(!confirm('Hapus baris ini?'))return;const r=by(t.dataset.id);r.del=1;await save(r);A.close();lst('0'+S.st)};
A.new=t=>{
  const st=t.dataset.st,kib=S.kib;
  const F=FIELDS[kib]||FIELDS.C;
  modal(`<form id="fm"><h3>Tambah data ${kib}-${st}</h3>
    ${F.filter(f=>['nama','kode','reg','alamat','tgl','harga'].includes(f[0])).map(f=>fld(f,'')).join('')}
    ${st==='02'?fld(['sebab','Sebab bertambah',[''].concat(SBT)],''):''}
    ${st==='03'?fld(['sebab','Sebab berkurang',[''].concat(SBK)],''):''}
    <div class="row"><button type="button" class="b p" data-a="nsave" data-st="${st}">Simpan</button>
    <button type="button" class="b" data-a="close">Batal</button></div></form>`);
};
A.nsave=async t=>{
  const d=fd(),st=t.dataset.st;
  if(!d.nama?.trim())return toast('Nama barang wajib diisi','w');
  const n=V().filter(r=>r.st==='0'+st&&r.opd===cur()&&r.kib===S.kib).length;
  await save({id:uid(),kib:S.kib,st:'0'+st,opd:cur(),no:n+1,...d,ada:st==='02'?'ADA':''});
  A.close();toast('Tersimpan','ok');lst('0'+S.st);
};

A.mut=t=>{
  const r=by(t.dataset.id);MT={id:r.id};
  modal(`<form id="fm"><h3>Mutasi / Koreksi</h3>
    <p><b>${esc(r.nama)}</b> · Reg ${esc(r.reg)}<br><small class="mu">Dikeluarkan dari ${esc(r.opd)} (${r.kib}-03), lalu dimasukkan ke ${r.kib}-02 OPD tujuan.</small></p>
    <label>Instansi tujuan<select name="to"><option value="">— pilih —</option>${D.opds.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}${o.name==r.opd?' (koreksi/pecah)':''}</option>`).join('')}</select></label>
    <label>…atau ketik instansi baru<input name="newto"></label>
    <label>Sebab berkurang<select name="sb">${SBK.map(s=>`<option${s==='Mutasi ke OPD Lain'?' selected':''}>${s}</option>`).join('')}</select></label>
    <label>Jumlah hasil koreksi<input name="n" type="number" min="1" max="9" value="1"></label>
    <div class="row"><button type="button" class="b p" data-a="tinjau">Tinjau</button>
    <button type="button" class="b" data-a="close">Batal</button></div></form>`);
};
A.tinjau=()=>{
  const d=fd(),r=by(MT.id),to=(d.newto||d.to).trim();
  if(!to)return toast('Pilih/ketik instansi tujuan','w');
  const n=Math.max(1,Math.min(9,+d.n||1));MT={...MT,to,sb:d.sb,n};
  const rows=Array.from({length:n},(_,i)=>`<fieldset style="border:1px solid var(--ln);border-radius:9px;margin:6px 0;padding:8px"><legend>Bangunan ${i+1}</legend>
    ${fld(['nama'+i,'Nama','text'],r.nama)}${fld(['kode'+i,'Kode','text'],r.kode)}
    ${fld(['alamat'+i,'Alamat benar','text'],r.alamat)}${fld(['luas'+i,'Luas','number'],r.luasUkur||r.luas||'')}
    ${fld(['harga'+i,'Harga','number'],Math.round((+r.harga||0)/n))}</fieldset>`).join('');
  modal(`<form id="fm"><h3>Tinjau mutasi</h3>
    <b>${r.kib}-03 — keluar dari ${esc(r.opd)}</b>
    <table><tr><th>Nama</th><th>Reg</th><th>Harga</th><th>Tujuan</th></tr>
    <tr><td>${esc(r.nama)}</td><td>${esc(r.reg)}</td><td>${rp(r.harga)}</td><td>${esc(to)}</td></tr></table>
    <p><b>${r.kib}-02 — masuk ke ${esc(to)}</b></p>${rows}
    <label>Sebab bertambah<select name="sbt">${SBT.map(s=>`<option${s===(to==r.opd?'Rincian Dari Aset Glondong':'Mutasi dari OPD lain')?' selected':''}>${s}</option>`).join('')}</select></label>
    <div class="row"><button type="button" class="b p" data-a="smut">Simpan</button>
    <button type="button" class="b" data-a="close">Batal</button></div></form>`);
};
A.smut=async()=>{
  const d=fd(),r=by(MT.id),mid=uid(),to=MT.to;let tot=0;
  for(let i=0;i<MT.n;i++)tot+=+d['harga'+i]||0;
  if(Math.abs(tot-(+r.harga||0))>1&&!confirm(`Total harga baru (${rp(tot)}) beda dari asal (${rp(r.harga)}). Tetap simpan?`))return;
  if(!D.opds.some(o=>o.name==to)){D.opds.push({name:to,keys:[to]});await kv('opds',D.opds)}
  const out=[],n2=V().filter(x=>x.st==='02'&&x.opd==to&&x.kib===r.kib).length;
  r.mut=mid;out.push(r);
  out.push({id:uid(),st:'03',kib:r.kib,opd:r.opd,...CP(r),sebab:MT.sb,tujuan:to,reff:r.no,reffId:r.id,mid,km:'Mutasi Kurang ke '+to});
  for(let i=0;i<MT.n;i++)out.push({id:uid(),st:'02',kib:r.kib,opd:to,no:n2+i+1,...CP(r),nama:d['nama'+i],kode:d['kode'+i],alamat:d['alamat'+i],luas:d['luas'+i],luasUkur:d['luas'+i],harga:d['harga'+i],jml:1,jmlLap:1,ada:'ADA',sebab:d.sbt,asal:r.opd,reff:r.no,reffId:r.id,mid,km:'Mutasi Tambah dari '+r.opd});
  await saveMany(out);A.close();toast(`Mutasi tersimpan (${r.kib}-03: 1, ${r.kib}-02: ${MT.n})`,'ok');lst('0'+S.st);
};
A.undo=async t=>{
  const r=by(t.dataset.id);if(!r||!r.mut)return;
  if(!confirm('Batalkan mutasi? Baris 02/03 terkait dihapus.'))return;
  const ch=V().filter(x=>x.mid==r.mut&&x.id!=r.id);
  ch.forEach(x=>x.del=1);r.mut='';await saveMany([r,...ch]);
  A.close();lst('0'+S.st);
};

/* ======================= HASIL ======================= */
function vHasil(){
  $('#v').innerHTML=`<div class="bar"><h3 style="margin:0">Hasil / ${S.kib}-04</h3><span class="ch">KIB ${S.kib}</span></div>
    <div class="kib-sel">${['A','B','C','D','E','F'].map(k=>`<button data-a="selKibHasil" data-k="${k}"${S.kib==k?' class="on"':''}>KIB ${k}</button>`).join('')}</div>
    <div class="pn"><div class="row">${sel()}</div></div>
    <div id="hs"></div>`;
  vHasilKib();
}
A.selKibHasil=t=>{S.kib=t.dataset.k;vHasil()};
function vHasilKib(){
  if(!S.opd){$('#hs').innerHTML='<p class="empty">Pilih instansi dulu.</p>';return}
  const rs=V().filter(r=>r.opd===cur()&&r.kib===S.kib);
  const c1=rs.filter(r=>r.st==='01'),c2=rs.filter(r=>r.st==='02'),c3=rs.filter(r=>r.st==='03');
  const h=hasil(c1,c2),sel1=c1.filter(r=>r.ada&&r.ada!=='BELUM').length;
  const diff=sm(c1)-sm(c3)+sm(c2)-sm(h);
  $('#hs').innerHTML=`<div class="pn"><table>
    <tr><th>Kategori</th><th>Baris</th><th>Nilai</th></tr>
    <tr><td>${S.kib}-01 tercatat</td><td>${c1.length}</td><td>${rp(sm(c1))}</td></tr>
    <tr><td>${S.kib}-03 keluar</td><td>−${c3.length}</td><td>−${rp(sm(c3))}</td></tr>
    <tr><td>${S.kib}-02 masuk</td><td>+${c2.length}</td><td>+${rp(sm(c2))}</td></tr>
    <tr><th>${S.kib}-04 Hasil</th><th>${h.length}</th><th>${rp(sm(h))}</th></tr>
  </table>
  <p class="mu">Terisi di lapangan: ${sel1}/${c1.length} · Keseimbangan: ${Math.abs(diff)<1?'<b style="color:var(--ok)">OK ✓</b>':'<b style="color:var(--er)">selisih '+rp(diff)+'</b>'}</p>
  <div class="row"><button class="b p" data-a="xl" data-kib="${S.kib}">📊 Unduh Excel KKI KIB ${S.kib}</button></div></div>`;
}
const hasil=(c1,c2)=>[...c1.filter(r=>r.ada!=='TIDAK'&&!r.mut),...c2];
const sm=a=>a.reduce((s,r)=>s+(+r.harga||0),0);

/* ======================= FOTO + TIMESTAMP + GPS ======================= */
const pos=()=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),()=>ok(null),{enableHighAccuracy:true,timeout:7000}):ok(null));

async function addPhoto(e,st){
  const f=e.target.files[0];e.target.value='';if(!f||!PR)return;
  const r=by(PR);
  await busy('Memproses foto…',async()=>{
    const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),
          c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);
    let p=null;
    if(st){
      p=await pos();
      const d=new Date(),z=n=>String(n).padStart(2,'0'),
            M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
            ln=[`${z(d.getDate())} ${M[d.getMonth()]} ${d.getFullYear()} ${z(d.getHours())}.${z(d.getMinutes())}.${z(d.getSeconds())}`,
                p?`${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`:'Koordinat tidak tersedia',
                (r.nama||'')+(r.reg?' (Reg '+r.reg+')':''),r.opd||''],
            fs=Math.round(c.width/40),h=ln.length*fs*1.25+fs*.6;
      x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-h,c.width,h);
      x.fillStyle='#fff';x.font=`bold ${fs}px sans-serif`;
      ln.forEach((s,i)=>x.fillText(s,fs/2,c.height-h+(i+1)*fs*1.25))
    }
    const blob=await new Promise(o=>c.toBlob(o,'image/jpeg',.85)),
          n=(await all('ph')).filter(q=>q.rid==r.id).length+1,id='p'+uid();
    await put('ph',{id,rid:r.id,opd:r.opd,name:`${(r.nama+'_'+(r.reg||'')).replace(/[^\w]+/g,'_')}_${n}_${id}.jpg`,blob,lat:p&&p.lat,lon:p&&p.lon});
    await put('q',{id:'q'+id,k:'p',pid:id});
    if(p&&!r.lat){r.lat=+p.lat.toFixed(7);r.lon=+p.lon.toFixed(7);await save(r)}
    upQ();
  });
  toast(navigator.onLine?'Foto tersimpan, dikirim ke Drive…':'Foto tersimpan offline','ok');
  edit(r.id);sync();
}

async function impInstansi(f){
  await js(XJS);
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  if(!a.length)throw new Error('File kosong');
  let n=0;
  for(let i=1;i<a.length;i++){
    const r=a[i];if(!r[0])continue;
    const o={name:String(r[0]).trim(),keys:String(r[1]||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean),
      alamat:String(r[2]||''),telp:String(r[3]||''),email:String(r[4]||''),kepala:String(r[5]||''),
      nipKepala:String(r[6]||''),pengurus:String(r[7]||''),nipPengurus:String(r[8]||''),
      tgl:r[9] instanceof Date?r[9].toISOString().slice(0,10):String(r[9]||'')};
    if(!o.keys.length)o.keys=[o.name];
    const idx=D.opds.findIndex(x=>x.name===o.name);
    if(idx<0){D.opds.push(o);n++}else Object.assign(D.opds[idx],o);
  }
  await kv('opds',D.opds);mkAbr();
  const g=await grup(false);
  toast(`Import instansi: ${n} baru, ${D.opds.length} total, ${g} baris diregroup`,'ok',8000);
  mInstansi();
}

const STS=['','BELUM','PROSES','SUDAH','NIHIL'],SC={BELUM:'er',PROSES:'wa',SUDAH:'ok',NIHIL:''},

  const pj={};C.forEach(c=>{const p=tx_(c.pj)||'(belum ada PJ)',o=pj[p]=pj[p]||{n:0,r:0,s:0};o.n++;o.r+=N(c.rT)+N(c.rB)+N(c.rK);o.s+=N(c.sT)+N(c.sB)+N(c.sK)});

    <input id="cq" placeholder="Cari instansi…"></div></div>

    (!F.s||(F.s==='late'?c.tgl&&c.tgl<td&&openT(c):F.s==='soon'?c.tgl&&c.tgl>=td&&c.tgl<=wk:F.s==='done'?all_(c).length&&all_(c).every(v=>v==='SUDAH'):has(c,F.s))));

      <div class="pb"><i style="width:${pb||0}%"></i></div></div>`}).join('')||'<p class="empty">Belum ada. Import atau tambahkan instansi.</p>';
}

async function post(b){
  const m=D.meta;if(!m.url)throw new Error('URL Apps Script belum diisi');
  const r=await fetch(m.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({secret:m.secret,...b})}),
        j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');return j;
}
A.ping=()=>busy('Tes koneksi…',async()=>{await A.msave();
  const r=await fetch(D.meta.url+'?secret='+encodeURIComponent(D.meta.secret)),j=await r.json();
  toast(j.ok?'Terhubung ✓':j.error,j.ok?'ok':'e')});
A.kirim=()=>sync(true);
const b64=b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result.split(',')[1]);f.readAsDataURL(b)});
async function sync(manual){
  if(syncing)return;if(!navigator.onLine)return manual&&toast('Offline','w');
  if(!D.meta.url)return manual&&toast('Isi URL Apps Script','w');syncing=1;
  try{
    const q=await all('q');if(!q.length){manual&&toast('Semua sudah terkirim','ok');return}
    await busy(`Mengirim ${q.length} data…`,async()=>{
      const rq=q.filter(x=>x.k==='r'),M=new Map(D.recs.map(r=>[r.id,r]));
      for(let i=0;i<rq.length;i+=100){
        const ch=rq.slice(i,i+100);
        await post({action:'put',items:ch.map(x=>M.get(x.rid)).filter(Boolean).map(r=>({id:r.id,ts:r.ts,j:JSON.stringify(r)}))});
        await tx('q','readwrite',s=>ch.forEach(x=>s.delete(x.id)));
      }
      for(const x of q.filter(x=>x.k==='p')){
        const p=await tx('ph','readonly',s=>s.get(x.pid));
        if(p)await post({action:'photo',opd:p.opd,name:p.name,data:await b64(p.blob)});
        await tx('q','readwrite',s=>s.delete(x.id));
      }
    });
    toast(`Berhasil: ${q.length} data terkirim`,'ok');
  }catch(e){toast('Gagal: '+e.message+' — data tetap aman','e',8000)}
  finally{syncing=0;upQ()}
}
A.tarik=()=>busy('Menarik data…',async()=>{
  const j=await post({action:'get'}),M=new Map(D.recs.map(r=>[r.id,r])),up=[];
  j.items.forEach(it=>{const l=M.get(it.id);if(!l||+it.ts>l.ts){const r=JSON.parse(it.j);if(l)Object.assign(l,r);else D.recs.push(r);up.push(l||r)}});
  await putMany('recs',up);toast(`${up.length} rekaman diperbarui`,'ok');render();
});

const iso=d=>d instanceof Date?new Date(d.getTime()+432e5).toISOString().slice(0,10):String(d??'').slice(0,10);

async function importX(f,kib){
  await js(XJS);
  const buf=await f.arrayBuffer();
  const names=XLSX.read(buf,{bookSheets:true}).SheetNames;
  let use=[names[0]];
  if(names.length>1&&confirm(`File punya ${names.length} sheet.\nOK = semua sheet, Batal = sheet pertama saja.`))use=names;
  const seen=new Set(V().filter(r=>r.kib===kib).map(r=>[r.kode,r.reg,r.nama,r.tgl,r.harga].join('|')));
  const add=[];let dup=0;
  for(const sn of use){
    const wb=XLSX.read(buf,{cellDates:true,sheets:sn}),
          a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),
          h=a.findIndex(r=>/^(NO)$/i.test(String(r[0]).trim()));
    if(h<0)continue;
    for(let i=h+1;i<a.length;i++){
      const r=a[i];
      if(String(r[0]).trim().toUpperCase()==='JUMLAH')break;
      if(!String(r[1]).trim()&&!String(r[2]).trim())continue;
      const o=parseRow(kib,r);
      if(!o)continue;
      const k=[o.kode,o.reg,o.nama,o.tgl,o.harga].join('|');
      if(seen.has(k)){dup++;continue}
      seen.add(k);add.push(o);
    }
  }
  if(!add.length)return toast('Tidak ada baris baru'+(dup?` (${dup} duplikat)`:''),'w');
  await saveMany(add);
  const g=await grup(false);
  toast(`Import KIB ${kib}: ${add.length} baru, ${dup} duplikat, ${g} diregroup`,'ok',9000);
  render();
}
function parseRow(kib,r){
  const base={id:uid(),kib,st:'01',opd:'',no:0};
  if(kib==='C'){
    const o={...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),alamat:tx_(r[4]),
      luas:r[5],tgl:iso(r[6]),jml:r[7],harga:r[8],ada:tx_(r[9]),bert:tx_(r[10]),beton:tx_(r[11]),
      kond:tx_(r[12]),guna:tx_(r[13]),kuasa:tx_(r[14]),jmlLap:r[15],luasUkur:r[16],
      rehab:tx_(r[17]),kap:tx_(r[18]),indukLain:tx_(r[19]),reff:tx_(r[20]),kd:tx_(r[21]),
      y:tx_(r[24]),ket:tx_(r[25])};
    if(!o.nama&&!o.kode)return null;return o;
  }
  if(kib==='A')return{...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),alamat:tx_(r[4]),luas:r[5],hak:tx_(r[6]),guna:tx_(r[7]),tgl:iso(r[8]),harga:r[9],ket:tx_(r[10])};
  if(kib==='B')return{...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),merk:tx_(r[4]),ukuran:tx_(r[5]),satuan:tx_(r[6]),jml:r[7],tgl:iso(r[8]),harga:r[9],kond:tx_(r[10]),alamat:tx_(r[11]),ket:tx_(r[12])};
  if(kib==='D')return{...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),konstruksi:tx_(r[4]),panjang:r[5],lebar:r[6],luas:r[7],alamat:tx_(r[8]),tgl:iso(r[9]),harga:r[10],kond:tx_(r[11]),ket:tx_(r[12])};
  if(kib==='E')return{...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),merk:tx_(r[4]),ukuran:tx_(r[5]),jml:r[6],alamat:tx_(r[7]),tgl:iso(r[8]),harga:r[9],kond:tx_(r[10]),ket:tx_(r[11])};
  if(kib==='F')return{...base,kode:tx_(r[1]),nama:tx_(r[2]),reg:tx_(r[3]),kontrak:tx_(r[4]),nilai:r[5],progress:r[6],mulai:iso(r[7]),selesai:iso(r[8]),alamat:tx_(r[9]),harga:r[10],ket:tx_(r[11])};
  return null;
}
async function grup(all){
  let ch=[];
  const P=D.opds.map(o=>({n:o.name,k:(o.keys||[]).map(norm).filter(Boolean).map(k=>new RegExp('(?<![a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![0-9])'))}));
  V().forEach(r=>{
    if(r.st!=='01'||r.lock||(r.opd&&!all))return;
    const T=[[norm(r.nama),3],[norm(r.alamat),2],[norm(r.y),3],[norm(r.ket),1]];
    let b='',bs=0;
    P.forEach(p=>{let s=0;p.k.forEach(re=>T.forEach(([t,w])=>{if(re.test(t))s+=w}));if(s>bs){bs=s;b=p.n}});
    if(b!==r.opd){r.opd=b;ch.push(r)}
  });
  if(ch.length)await saveMany(ch);return ch.length;
}
async function impCtl(f){
  await js(XJS);
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),
        nm=n=>wb.SheetNames.find(s=>s.trim().toLowerCase()===n),
        pg=nm('progres'),jd=nm('jadwal mingguan');
  if(!pg)throw new Error('Sheet "Progres" tidak ditemukan');
  const M=ctlMap(),out=[];let nO=0;
  const get=n=>{n=n.trim();let o=D.opds.find(x=>norm(x.name)==norm(n));if(!o){o={name:n,keys:[n]};D.opds.push(o);nO++}return o.name},
        rec=n=>{let r=M.get(n);if(!r){r={id:'ctl:'+n,st:'ctl',opd:n};M.set(n,r)}if(!out.includes(r))out.push(r);return r},
        sv=v=>{v=tx_(v).toUpperCase();return STS.includes(v)?v:''},
        nz=v=>typeof v==='number'?v:'';
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[pg],{header:1,raw:true,defval:''});
  for(let i=10;i<rows.length;i++){
    const r=rows[i],u=tx_(r[1]);
    if(!u||/^jumlah/i.test(u)||r[0]===''||isNaN(+r[0]))continue;
    const c=rec(get(u));
    Object.assign(c,{tim:tx_(r[2]),jt:sv(r[3]),pj:tx_(r[27])||c.pj||'',
      rT:nz(r[17]),rB:nz(r[18]),rK:nz(r[19]),sT:nz(r[20]),sB:nz(r[21]),sK:nz(r[22]),final:nz(r[16])});
    [['tl',4],['in',7],['dn',10],['ft',13]].forEach(([k,j])=>KB.forEach((b,x)=>c[k+b]=sv(r[j+x])));
  }
  await saveMany(out);await kv('opds',D.opds);mkAbr();
  toast(`Controlling: ${out.length} instansi, ${nO} baru`,'ok',9000);render();
}

A.xl=t=>{const kib=t.dataset.kib||S.kib;exportKib(kib)};
async function exportKib(kib){
  await busy('Menyusun Excel KKI…',async()=>{
    const o=D.opds.find(x=>x.name==cur());
    if(!o)return toast('Pilih instansi dulu','w');
    await js(EXJS);
    const W=new ExcelJS.Workbook(),m=D.meta,rs=V().filter(r=>r.opd===cur()&&r.kib===kib);
    const c1=rs.filter(r=>r.st==='01').sort((a,b)=>(a.no||0)-(b.no||0)),
          c2=rs.filter(r=>r.st==='02'),c3=rs.filter(r=>r.st==='03'),h=hasil(c1,c2);
    const FIELDS_K=(FIELDS[kib]||FIELDS.C);
    const H=FIELDS_K.map(f=>[String(f[1]).toUpperCase(),'',Math.max(12,Math.min(30,String(f[1]).length+2))]);
    const put=async(name,title,code,rows)=>{
      const ws=W.addWorksheet(name,{views:[{state:'frozen',ySplit:8,xSplit:3}]}),
            n=H.length;
      for(let i=1;i<=4;i++){ws.mergeCells(i,1,i,n-1);ws.getRow(i).font={bold:true,size:i===1?13:11}}
      ws.getCell(1,1).value='Kertas Kerja Inventarisasi/Validasi (KKI)';
      ws.getCell(2,1).value=title;ws.getCell(3,1).value=(o.name||'').toUpperCase();
      ws.getCell(4,1).value='Pemerintah Daerah Provinsi '+(m.prov||'');
      ws.getCell(2,n).value='FORM - KKI';ws.getCell(3,n).value=code;
      ws.getCell(3,n).font=ws.getCell(2,n).font={bold:true};
      H.forEach(([l,s,w],i)=>{const c=i+1;ws.getColumn(c).width=w;ws.getCell(6,c).value=l;ws.getCell(8,c).value=c});
      rows.forEach((r,i)=>FIELDS_K.forEach((f,j)=>ws.getCell(9+i,j+1).value=r[f[0]]??''));
      ws.getColumn(5).numFmt='#,##0';
    };
    await put('Form_'+kib+'_01','DAFTAR RINCIAN BARANG HASIL INVENTARISASI','FORM '+kib+'-01',c1);
    await put('Form_'+kib+'_02','USULAN MUTASI TAMBAH','FORM '+kib+'-02',c2);
    await put('Form_'+kib+'_03','USULAN MUTASI KURANG','FORM '+kib+'-03',c3);
    await put('Form_'+kib+'_04','USULAN DAFTAR HASIL','FORM '+kib+'-04',h);
    const b=await W.xlsx.writeBuffer(),a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=`KKI_KIB_${kib}_${(o.name||'').replace(/[^\w]+/g,'_')}.xlsx`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Excel selesai','ok');
  });
}
