<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf3e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t="light";try{t=localStorage.getItem("inv-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t=="dark"?"#1a110d":"#fdf3e7"})()</script>
<title>Inventarisasi Aset</title>
<style>
:root{
  --bg:#fdf3e7;--sf:#fff;--sf2:#fff8ef;--ink:#3b1f14;--mu:#8a7262;--ln:#f0e0cc;
  --pr:#fbc531;--pr2:#f6b100;--pi:#3b1f14;--ac:#e8761f;
  --ok:#1f9d5f;--er:#d93f3f;--wa:#c27800;
  --sh:0 1px 2px rgba(85,41,31,.05),0 6px 18px -8px rgba(85,41,31,.12);
  --shg:0 14px 30px -12px rgba(85,41,31,.25);
  --r:22px;--hh:84px;--fn:"Outfit","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1a110d;--sf:#261913;--sf2:#2e1f18;--ink:#f8eadc;--mu:#b39b8a;--ln:#3d2b21;
  --pr:#fbc531;--pr2:#f6b100;--pi:#2a1a10;--ac:#f4883c;
  --ok:#4cd08a;--er:#ff7a7a;--wa:#f5b04a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.5);
  --shg:0 16px 34px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.55 var(--fn);background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:20;margin:8px 10px 0;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:var(--sh);border-radius:999px;display:flex;gap:8px;align-items:center;padding:8px 10px 8px 12px}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.brand-logo{width:104px;height:38px;display:flex;align-items:center;flex-shrink:0;background:#fff;border-radius:999px;padding:4px 10px;border:1px solid var(--ln)}
.brand-logo svg,.brand-logo img{height:100%;width:auto;max-width:100%}
.brand-text{min-width:0;margin-left:2px}
.brand-text b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{color:var(--mu);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--ln);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sf2);color:var(--ink)}
.chip.tg{cursor:pointer;font:inherit;font-size:15px;line-height:1;padding:7px 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.chip.off .dot{background:var(--er)}
@media(max-width:640px){#qc{display:none}.brand-text small{display:none}.brand-logo{width:84px}}
.layout{display:flex;gap:18px;padding:14px 10px 0;min-height:calc(100vh - var(--hh))}
aside{display:none;width:220px;flex-shrink:0;position:sticky;top:calc(var(--hh) + 6px);height:fit-content;max-height:calc(100vh - var(--hh) - 16px);overflow-y:auto;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px;box-shadow:var(--sh)}
aside button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;text-align:left;border-radius:999px;margin-bottom:3px;cursor:pointer;transition:background .15s}
aside button:hover{background:var(--sf2)}
aside button.on{background:var(--pr);color:var(--pi)}
aside button .ic{width:22px;text-align:center;font-size:16px}
main{flex:1;min-width:0;max-width:1100px;margin:0 auto;width:100%}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;overflow-x:auto;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:999px;padding:6px;box-shadow:var(--shg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:58px;padding:7px 4px 6px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:11px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s}
nav button .ic{font-size:17px}
nav button.on{background:var(--pr);color:var(--pi)}
@media(min-width:900px){body{padding-bottom:0}aside{display:block}nav{display:none}.layout{padding:18px 18px 0}header{margin:12px 18px 0}}
.pn,.cd{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.cd{cursor:pointer;padding:14px 16px;margin-bottom:10px;transition:transform .12s,box-shadow .15s,border-color .15s}
.cd:hover{box-shadow:var(--shg);transform:translateY(-1px);border-color:var(--pr)}
.cd small,.mu{color:var(--mu);display:block;font-size:12.5px;margin-top:2px}
h1,h2,h3{letter-spacing:-.02em}
h3{margin:0 0 12px;font-size:18px;font-weight:700}
h4{margin:0 0 12px;font-size:15px;font-weight:700}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;margin:10px 0}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf2);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
textarea{resize:vertical;min-height:64px}
.b{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.b:hover{background:var(--sf2);border-color:color-mix(in srgb,var(--ink) 25%,var(--ln))}
.b:active{transform:scale(.97)}
.b.p{background:var(--pr);color:var(--pi);border-color:transparent;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pr2) 80%,transparent)}
.b.p:hover{background:var(--pr2)}
.b.d{color:var(--er);border-color:color-mix(in srgb,var(--er) 45%,transparent)}
.b.sm{padding:6px 12px;font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>select,.row>input{flex:1;min-width:140px;width:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch{font-style:normal;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--ln);margin:6px 5px 0 0;display:inline-block;color:var(--mu);background:var(--sf2)}
.ch.ok{color:var(--ok);border-color:transparent;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ch.er{color:var(--er);border-color:transparent;background:color-mix(in srgb,var(--er) 14%,transparent)}
.ch.wa{color:var(--wa);border-color:transparent;background:color-mix(in srgb,var(--wa) 16%,transparent)}
#ld{position:fixed;inset:0;z-index:100;background:rgba(40,20,10,.55);backdrop-filter:blur(5px);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#fff}
.sp{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#fbc531;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#ts{position:fixed;left:12px;right:12px;top:calc(76px + env(safe-area-inset-top));z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.t{padding:12px 18px;border-radius:999px;background:#3b1f14;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.25);animation:tin .22s;font-size:14px;font-weight:500;max-width:560px}
.t.ok{background:#1f8a56}.t.e{background:#c63636}.t.w{background:#a8620a}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
dialog{width:min(680px,96vw);max-height:92vh;border:0;border-radius:28px;background:var(--sf);color:var(--ink);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(40,20,10,.55);backdrop-filter:blur(4px)}
dialog h3{margin-bottom:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
td,th{border-bottom:1px solid var(--ln);padding:8px 10px;text-align:left}
tr:last-child td{border-bottom:0}
th{background:var(--sf2);font-weight:700}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.th img{width:76px;height:60px;object-fit:cover;border-radius:14px;border:1px solid var(--ln)}
#mw{position:relative}#map{height:62vh;border-radius:var(--r);border:1px solid var(--ln)}
#nA{position:absolute;right:12px;top:12px;z-index:500;background:rgba(255,255,255,.94);color:#000;border-radius:50%;width:46px;height:46px;text-align:center;font-weight:800;line-height:1.05;padding-top:5px;box-shadow:var(--sh)}
.mk b{display:block;background:#e4572e;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;text-align:center;line-height:24px;font-size:12px}
.pb{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%;background:var(--ok);border-radius:99px;padding:0;border:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tabs button{padding:8px 16px;border:1.5px solid var(--ln);background:var(--sf);border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kib-sel{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.kib-sel button{flex:1;min-width:72px;padding:11px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:18px;font:inherit;font-weight:700;cursor:pointer}
.kib-sel button.on{background:var(--pr);color:var(--pi);border-color:transparent;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pr2) 80%,transparent)}
footer{text-align:center;padding:20px;color:var(--mu);font-size:12px;margin-top:20px}
.empty{text-align:center;padding:36px;color:var(--mu)}
.logo-preview{max-height:60px;max-width:140px;object-fit:contain;border:1px dashed var(--ln);border-radius:12px;padding:4px;background:#fff}
/* --- Beranda --- */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:32px;padding:clamp(20px,4vw,40px);margin-bottom:14px;box-shadow:var(--sh)}
.hero h1{margin:0 0 10px;font-size:clamp(26px,4.6vw,44px);line-height:1.08;font-weight:700}
.hero p{margin:0 0 18px;color:var(--mu);max-width:46ch}
.hero .row{margin:0}
.art{position:relative;min-height:190px;overflow:hidden;border-radius:24px}
.art i{position:absolute;display:block}
.art .a1{width:46%;aspect-ratio:1;background:var(--pr);border-radius:50%;left:6%;top:8%}
.art .a2{width:30%;aspect-ratio:1;background:#f47c8c;border-radius:34% 66% 58% 42%/42% 40% 60% 58%;right:6%;top:2%}
.art .a3{width:38%;height:34%;background:#2fa66a;border-radius:999px;right:4%;bottom:12%}
.art .a4{width:26%;aspect-ratio:1;border:14px solid var(--ac);border-radius:50%;left:30%;bottom:2%}
.art .a5{width:14%;aspect-ratio:1;background:#55291f;border-radius:50%;left:2%;bottom:18%}
:root[data-theme="dark"] .art .a5{background:#f8eadc}
@media(max-width:700px){
  .hero{grid-template-columns:1fr}
  .art{min-height:0;height:120px;order:-1;margin-bottom:6px}
  .art i{width:auto!important}
  .art .a1{height:82%;top:9%;left:8%}
  .art .a2{height:62%;top:6%;right:7%}
  .art .a3{height:30%;width:34%!important;right:3%;bottom:10%}
  .art .a4{height:56%;left:36%;bottom:4%;border-width:10px}
  .art .a5{height:26%;left:2%;bottom:14%}
}
.sec{margin:22px 4px 10px;font-size:20px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{cursor:pointer;border-radius:28px;padding:18px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;background:var(--t);color:var(--tc);transition:transform .15s,box-shadow .15s;border:0;text-align:left;font:inherit}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shg)}
.tile b{font-size:clamp(28px,5vw,40px);line-height:1;font-weight:700;letter-spacing:-.03em}
.tile span{font-size:13px;font-weight:600;line-height:1.3}
.tile em{font-style:normal;font-size:12px;font-weight:700;background:rgba(255,255,255,.28);border-radius:999px;padding:2px 10px;align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px}
.stats b{display:block;font-size:clamp(26px,5vw,38px);font-weight:700;color:var(--ac);letter-spacing:-.03em;line-height:1.1}
.stats span{color:var(--mu);font-size:12.5px}
/* --- Tabel data (preview + edit) --- */
.gw{position:relative;overflow:auto;max-height:68vh;border:1px solid var(--ln);border-radius:20px;background:var(--sf);box-shadow:var(--sh);margin-bottom:10px}
.gt{width:max-content;min-width:100%;border:0;border-radius:0;overflow:visible;font-size:13px}
.gt th{position:sticky;top:0;z-index:3;background:var(--sf2);white-space:nowrap;border-right:1px solid var(--ln);cursor:default}
.gt td{white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--ln);padding:7px 10px}
.gt td.n{text-align:right;font-variant-numeric:tabular-nums}
.gt .s0{position:sticky;left:0;z-index:2;background:var(--sf2);min-width:46px;text-align:center;color:var(--mu)}
.gt .s1{position:sticky;left:46px;z-index:2;background:var(--sf2);min-width:78px;padding:4px 6px}
.gt th.s0,.gt th.s1{z-index:4}
.gt tbody tr:hover td:not(.sel){background:color-mix(in srgb,var(--pr) 10%,var(--sf))}
.gt tbody tr:hover td.s0,.gt tbody tr:hover td.s1{background:var(--sf2)}
.gw.ed td[data-j]{cursor:cell;user-select:none;-webkit-user-select:none}
.gw.ed th[data-hj],.gw.ed td.s0{cursor:pointer}
.gt td.sel{background:color-mix(in srgb,var(--pr) 30%,var(--sf))}
.gt td.cur{outline:2px solid var(--ac);outline-offset:-2px}
.gt td.fl{outline:2px dashed var(--ac);outline-offset:-2px;background:color-mix(in srgb,var(--ac) 12%,var(--sf))}
.gt td input,.gt td select{padding:5px 7px;border-radius:8px;min-width:130px;width:100%}
#fh{position:absolute;width:12px;height:12px;background:var(--ac);border:2px solid var(--sf);border-radius:4px;cursor:crosshair;z-index:6;touch-action:none}
#fh::after{content:"";position:absolute;inset:-14px}
.ib{border:0;background:none;cursor:pointer;font-size:15px;padding:3px 5px;border-radius:8px}
.ib:hover{background:var(--ln)}
.b:disabled{opacity:.4;cursor:not-allowed}
/* --- Perapian layar HP: tidak ada elemen saling menutupi --- */
.pn,dialog{overflow-x:auto}
dialog{overscroll-behavior:contain}
#nA{right:auto!important;left:12px;top:auto!important;bottom:30px}
@media(max-width:640px){
  input,select,textarea{font-size:16px}
  .gt td{max-width:220px}
  .gt .s1{position:static;min-width:64px}
  .gt th.s1{position:sticky;left:auto}
  .gw{max-height:62vh}
  .b{padding:9px 14px}
  .row>select,.row>input{min-width:100%}
  #ts{top:calc(72px + env(safe-area-inset-top))}
  .t{border-radius:18px;font-size:13px}
  dialog{width:100vw;max-width:100vw;max-height:94vh;margin:auto 0 0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .hero{border-radius:24px}.sec{margin-top:18px}
}
@media(max-width:380px){.chip{padding:4px 8px;font-size:11px}.brand-logo{width:64px;height:32px;padding:3px 6px}.brand-text b{font-size:13px}header{padding:6px 8px;gap:6px}.stats{grid-template-columns:1fr}}
/* --- Kelap-kelip: aksi yang perlu dilakukan --- */
@keyframes pls{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 70%,transparent);filter:none}50%{box-shadow:0 0 0 9px transparent;filter:brightness(1.12) saturate(1.25)}}
@keyframes plc{0%,100%{background:var(--pr)}33%{background:#f4883c}66%{background:#f47c8c}}
.pulse{animation:pls 1.4s ease-in-out infinite!important;position:relative}
.b.pulse,nav button.pulse,aside button.pulse{animation:pls 1.4s ease-in-out infinite,plc 2.8s linear infinite!important;color:var(--pi)}
.chip.pulse{animation:pls 1.4s ease-in-out infinite!important;border-color:var(--ac);color:var(--ac)}
nav button.pulse .ic,aside button.pulse .ic{animation:pls 1.4s ease-in-out infinite}
/* --- Inventarisasi lapangan (mudah dipakai di HP) --- */
.rg{display:flex;gap:8px;flex-wrap:wrap}
.rb{position:relative;cursor:pointer;display:block;margin:0;font-weight:700}
.rb input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.rb span{display:block;padding:12px 18px;min-width:92px;text-align:center;border:2px solid var(--ln);border-radius:999px;background:var(--sf2);transition:background .12s,border-color .12s}
.rb input:checked+span{background:var(--pr);color:var(--pi);border-color:transparent;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pr2) 80%,transparent)}
.rb input[value=TIDAK]:checked+span,.rb input[value=RB]:checked+span,.rb input[value="TDK SESUAI"]:checked+span{background:var(--er);color:#fff}
.rb input:focus-visible+span{outline:3px solid var(--ac);outline-offset:2px}
.qf{margin:14px 0}.qf>b{display:block;margin-bottom:6px;font-size:13px}
.iv-g,.iv-r{display:flex;flex-direction:row;gap:10px;align-items:flex-start;margin:0;cursor:pointer}
.iv-g{align-items:center;padding:10px 4px;margin-top:8px;border-bottom:2px solid var(--ln)}
.iv-r{padding:10px 4px;border-bottom:1px solid var(--ln);font-weight:400}
.iv-r small{display:block;color:var(--mu)}
.iv-g input,.iv-r input{width:22px;height:22px;flex:none;margin-top:2px;padding:0}
.ivbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:10px;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:999px;box-shadow:var(--shg)}
.ivbar .b.p{flex:1}
@media(min-width:900px){.ivbar{bottom:12px}}
/* --- V3: menu bawah pas, peta jadwal, kamera --- */
nav{padding:6px 0;gap:0;scroll-snap-type:x mandatory}
nav button{flex:0 0 20%;min-width:0;scroll-snap-align:start;padding:7px 1px 6px;font-size:clamp(9px,2.6vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jmap{height:320px;border-radius:16px;border:1px solid var(--ln);z-index:0}
#fo{position:fixed;inset:0;z-index:500;background:#000}#fo iframe{width:100%;height:100%;border:0}
.inf summary{cursor:pointer;font-weight:600;margin:8px 0}
/* --- Status kirim latar belakang --- */
#net.sy .dot{animation:pls 1s ease-in-out infinite;background:var(--wa)}
#net[data-q]:not([data-q="0"])::after{content:attr(data-q);margin-left:6px;background:var(--wa);color:#fff;border-radius:99px;padding:0 6px;font-size:10px}
#qc[data-a="cfopen"]{display:inline-block!important;cursor:pointer;border-color:var(--er);color:var(--er)}
/* --- dropdown multi-pilih --- */

  const r=indexedDB.open('inv',2);
  r.onupgradeneeded=()=>{const d=r.result;['recs','kv','ph','q'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s=='kv'?'k':'id'})})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(s,m),rq=f(t.objectStore(s));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error)})};
const put=(s,o)=>tx(s,'readwrite',x=>x.put(o)),
      all=s=>tx(s,'readonly',x=>x.getAll()),
      putMany=(s,a)=>tx(s,'readwrite',x=>a.forEach(o=>x.put(o))),
      kv=(k,v)=>{const r=put('kv',{k,v});if(MST.includes(k))mSoon();return r};

/* ==== FUNGSI save & saveMany (PERBAIKAN BUG) ==== */
async function save(r){
  r.ts=Date.now();
  if(!D.recs.includes(r))D.recs.push(r);
  await put('recs',r);
  await put('q',{id:'r'+r.id,k:'r',rid:r.id});
  upQ();bgSync();
}
async function saveMany(a){
  const t=Date.now();
  a.forEach(r=>{r.ts=t;if(!D.recs.includes(r))D.recs.push(r)});
  await putMany('recs',a);
  await putMany('q',a.map(r=>({id:'r'+r.id,k:'r',rid:r.id})));
  upQ();bgSync();
}

/* --- seret isi (fill handle) --- */
function freg(r,t){
  const dr=t.i>r.i2?t.i-r.i2:t.i<r.i1?t.i-r.i1:0,dc=t.j>r.j2?t.j-r.j2:t.j<r.j1?t.j-r.j1:0;
  if(!dr&&!dc)return null;
  if(Math.abs(dr)>=Math.abs(dc))return dr>0?{i1:r.i2+1,i2:t.i,j1:r.j1,j2:r.j2,v:1}:{i1:t.i,i2:r.i1-1,j1:r.j1,j2:r.j2,v:1};
  return dc>0?{i1:r.i1,i2:r.i2,j1:r.j2+1,j2:t.j,v:0}:{i1:r.i1,i2:r.i2,j1:t.j,j2:r.j1-1,v:0};
}
const applyFill=()=>op(applyFill_),fillBtn=d=>op(()=>fillBtn_(d)),pasteText=t=>op(()=>pasteText_(t));
function paintFill(){
  document.querySelectorAll('#gt td.fl').forEach(e=>e.classList.remove('fl'));

  for(let i=f.i1;i<=f.i2;i++)for(let j=f.j1;j<=f.j2;j++){const c=cell(i,j);c&&c.classList.add('fl')}
}
function applyFill_(){
  const r=G.fill.r,f=G.fill.to&&freg(r,G.fill.to);if(!f)return paint();
  const h=r.i2-r.i1+1,w=r.j2-r.j1+1,md=(a,n)=>((a%n)+n)%n;
  for(let i=f.i1;i<=f.i2;i++)for(let j=f.j1;j<=f.j2;j++){
    const si=f.v?r.i1+md(i-r.i1,h):i,sj=f.v?j:r.j1+md(j-r.j1,w);
    setVal(G.rows[i],G.cols[j],G.rows[si][G.cols[sj][0]]);
  }
  G.a={i:Math.min(r.i1,f.i1),j:Math.min(r.j1,f.j1)};G.b={i:Math.max(r.i2,f.i2),j:Math.max(r.j2,f.j2)};
  refresh();flush();paint();
}

  const k=e.key,m=e.ctrlKey||e.metaKey,D4={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};

  return `<label>${l}<input name="${k}" type="${t}" value="${esc(v)}"${t==='number'?' step="any" inputmode="decimal"':''}${k==='nama'?' list="brgl" autocomplete="off"':''}></label>`;

async function addPhoto(e,st){
  const f=e.target.files[0];e.target.value='';if(!f||!PR)return;
  const r=by(PR);
  await busy('Memproses foto…',async()=>{
    const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),
          c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);
    let p=null;
    if(st){
      p=await pos();
      const d=new Date(),z=n=>String(n).padStart(2,'0'),
            M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
            ln=[`${z(d.getDate())} ${M[d.getMonth()]} ${d.getFullYear()} ${z(d.getHours())}.${z(d.getMinutes())}.${z(d.getSeconds())}`,
                p?`${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`:'Koordinat tidak tersedia',
                (r.nama||'')+(r.reg?' (Reg '+r.reg+')':''),r.opd||''],
            fs=Math.round(c.width/40),h=ln.length*fs*1.25+fs*.6;
      x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-h,c.width,h);
      x.fillStyle='#fff';x.font=`bold ${fs}px sans-serif`;
      ln.forEach((s,i)=>x.fillText(s,fs/2,c.height-h+(i+1)*fs*1.25))
    }
    const blob=await new Promise(o=>c.toBlob(o,'image/jpeg',.85)),
          n=(await all('ph')).filter(q=>q.rid==r.id).length+1,id='p'+uid();
    await put('ph',{id,rid:r.id,opd:r.opd,name:`${(r.nama+'_'+(r.reg||'')).replace(/[^\w]+/g,'_')}_${n}_${id}.jpg`,blob,lat:p&&p.lat,lon:p&&p.lon});
    await put('q',{id:'q'+id,k:'p',pid:id});
    if(p&&!r.lat){r.lat=+p.lat.toFixed(7);r.lon=+p.lon.toFixed(7);await save(r)}
    upQ();
  });
  toast(navigator.onLine?'Foto tersimpan, dikirim ke Drive…':'Foto tersimpan offline','ok');if(typeof ivPh==='function')ivPh();
  edit(r.id);sync();
}

    Object.keys(sn).forEach(rk=>{if(!cur.has(rk)&&!sn[rk].del)q.push({id:'m:'+name+'|'+rk,k:'m',name,rk,j:JSON.stringify({del:1}),bts:sn[rk].ts})});

async function pullMasters(full){
  const j=await post({action:'mget',since:full?0:D.pullTs.m||0});let mx=full?0:(D.pullTs.m||0);const grp={};
  j.items.forEach(it=>{mx=Math.max(mx,+it.ts);const i=it.id.indexOf('|'),name=it.id.slice(0,i);if(!ADP[name])return;let o;try{o=JSON.parse(it.j)}catch(_){return}(grp[name]=grp[name]||[]).push({rk:it.id.slice(i+1),ts:+it.ts,o})});
  let ch=0;

    const cur=ADP[name].rows(),sn=D.msnap[name]||(D.msnap[name]={});let mod=0;
    for(const{rk,ts,o}of grp[name]){
      const s=sn[rk],has=cur.has(rk),lv=has?cur.get(rk):undefined;
      if(s&&ts<=s.ts)continue;

      if(o.del){
        if(!has){sn[rk]={del:1,ts};continue}
        if(dirty){if(Date.now()-ts<DAY)addCf({kind:'m',name,rk,ts,rem:null,loc:lv});else sn[rk]={...s,ts};continue}
        cur.delete(rk);sn[rk]={del:1,ts};mod=1;continue;
      }
      if(!s){if(has&&njs(lv)===njs(o.v)){sn[rk]={h:hsh(njs(lv)),ts};continue}cur.set(rk,o.v);sn[rk]={h:hsh(njs(o.v)),ts};mod=1;continue}
      if(dirty){if(Date.now()-ts<DAY)addCf({kind:'m',name,rk,ts,rem:o.v,loc:lv});else sn[rk]={...s,ts};continue}
      cur.set(rk,o.v);sn[rk]={h:hsh(njs(o.v)),ts};mod=1;
    }
    if(mod){ADP[name].apply(cur);await kvQ(name,ADP[name].val());ch++}
  }

async function wilLoad(){

function wilAlias(t){

function fuzzy(key){

const inK=(e,k)=>e.k===k||e.k.startsWith(k+'.')||k.startsWith(e.k+'.');

  for(let w=4;w>=1;w--)for(let i=0;i+w<=n;i++){

    if(!m.fz&&e.l>=3&&!ok&&m.es.length>1&&!(m.hint===e.l))return C.push({e,m,s:-1,amb:1});

/* --- Instansi otomatis dari import: nama beda, singkatan, typo --- */
const opdKey=n=>norm(n).replace(/\b0+(\d)/g,'$1');
const digs=s=>(String(s).match(/\d+/g)||[]).join(',');
function canonOpd(n){
  const k=opdKey(n),al=D.oalias||(D.oalias={});if(al[k])return al[k];
  const a=k.replace(/ /g,'');let best=null;
  for(const o of D.opds){
    const k2=opdKey(o.name);if(k2===k)return o.name;
    const b=k2.replace(/ /g,''),L=Math.max(a.length,b.length),mx=L<12?1:L<25?2:3;
    if(a.length>5&&digs(a)===digs(b)){const d=dl(a,b,mx);if(d<=mx&&(!best||d<best.d))best={n:o.name,d}}
  }
  if(best){al[k]=best.n;if(ensureOpd.fix)ensureOpd.fix.push(`${n} → ${best.n}`);ensureOpd.al=1;return best.n}
  return null;
}
function ensureOpd(n){n=String(n).trim();const c=canonOpd(n);if(c)return c;D.opds.push({name:n,keys:[n]});ensureOpd.n=1;return n}
async function learnAbbr(){
  const have=new Set(D.abbr.split('\n').map(l=>l.split('=')[0].trim()).filter(Boolean)),add=[],SW=new Set(['dan','dengan','di','yang','untuk','pada','se']);
  const acr=n=>wn(n).split(' ').filter(w=>w&&!SW.has(w)).map(w=>w[0]).join(''),ac=new Map(),toks=new Set();
  D.opds.forEach(o=>{const a=acr(o.name);if(a.length>=3)ac.set(a,wn(o.name));wn(o.name).split(' ').forEach(t=>{if(t.length>=3&&t.length<=9)toks.add(t)})});
  toks.forEach(t=>{if(have.has(t))return;const m=t.match(/^(sma|smk|smp|sd|mts|mi|slb)n$/);
    if(ac.has(t)&&ac.get(t)!==t){add.push(`${t}=${ac.get(t)}`);have.add(t)}else if(m){add.push(`${t}=${m[1]} negeri`);have.add(t)}});
  if(!add.length)return 0;
  D.abbr=(D.abbr.trim()+'\n'+add.join('\n')).trim();mkAbr();await kv('abbr',D.abbr);return add.length;
}

  const nm=[...cnt.keys()],par=nm.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i])),ky=nm.map(n=>opdKey(n).replace(/ /g,''));

/* --- Alamat/lokasi disamakan per instansi (ambil yang paling lengkap) --- */
const ADR_STOP=new Set('jalan jl jln desa kel kelurahan kec kecamatan kab kabupaten kota provinsi prov dusun dsn rt rw no nomor di'.split(' '));
const adrTok=a=>new Set(wn(a).split(' ').filter(t=>t&&!ADR_STOP.has(t)));
const adrEmpty=a=>{const s=String(a??'').trim();return !s||/^[-–—.\/\s]+$/.test(s)||/^(tidak ada|belum ada|n\/a|na)$/i.test(s)};
const adrCompat=(A_,B_)=>{const i=[...A_].filter(t=>B_.has(t)).length,m=Math.min(A_.size,B_.size);return m>0&&(m===1?i===1:i>=Math.max(2,Math.ceil(m*.6)))};
function addrPlan(rows){
  const cnt=new Map();rows.forEach(r=>{if(!adrEmpty(r.alamat)){const a=String(r.alamat).trim();cnt.set(a,(cnt.get(a)||0)+1)}});
  const ad=[...cnt.keys()].map(a=>({a,t:adrTok(a),n:cnt.get(a)})).sort((x,y)=>y.t.size-x.t.size||y.a.length-x.a.length),cl=[];
  ad.forEach(x=>{const c=cl.find(c=>adrCompat(x.t,c.m.t));if(c){c.mem.push(x);c.n+=x.n}else cl.push({m:x,mem:[x],n:x.n})});
  if(!cl.length)return[];
  const dom=cl.slice().sort((a,b)=>b.n-a.n||b.m.t.size-a.m.t.size)[0],to=new Map();
  cl.forEach(c=>c.mem.forEach(x=>{if(x.a!==c.m.a)to.set(x.a,c.m.a)}));
  return rows.flatMap(r=>{if(adrEmpty(r.alamat))return[{r,to:dom.m.a}];const a=String(r.alamat).trim();return to.has(a)?[{r,to:to.get(a)}]:[]});
}
function addrChanges(opds){
  const sets=opds?new Set(opds):null,by_=new Map();
  V().forEach(r=>{if(r.kib&&r.st==='01'&&r.opd&&(!sets||sets.has(r.opd))){if(!by_.has(r.opd))by_.set(r.opd,[]);by_.get(r.opd).push(r)}});
  return[...by_.values()].flatMap(addrPlan);
}
async function addrSync(opds,o={}){

  hb();ch.forEach(({r,to})=>{hn(r);r.alamat=to});hc();await saveMany(ch.map(c=>c.r));return ch.length;

const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fdl=d=>{const x=new Date(d+'T00:00:00');return `${HARI[x.getDay()]}, ${String(x.getDate()).padStart(2,'0')} ${BLN[x.getMonth()]} ${x.getFullYear()}`};
const JD={cps:[],tim:'TIM 1',date:'',kibs:new Set(['A','C']),wts:[],gs:[],pg:1,cart:[],cur:'',edit:'',route:null,tok:0};
const kibTxt=ks=>{const a=(ks||[]).map(k=>'KIB '+k);return a.length>1?a.slice(0,-1).join(', ')+' dan '+a[a.length-1]:a.join('')};
const fmtMin=m=>m>=60?`${Math.floor(m/60)} jam ${Math.round(m%60)} menit`:`${Math.max(1,Math.round(m))} menit`;
function opdCoord(n){
  const o=D.opds.find(x=>x.name===n);
  if(o&&o.lat!=null&&o.lat!==''&&!isNaN(+o.lat))return{c:[+o.lat,+o.lon],src:o.latSrc==='sekolah'?'koordinat sekolah':'koordinat instansi'};
  const rs=V().filter(r=>r.kib&&r.opd===n&&r.lat!=null&&r.lat!==''&&!isNaN(+r.lat));
  if(rs.length)return{c:[rs.reduce((s,r)=>s+ +r.lat,0)/rs.length,rs.reduce((s,r)=>s+ +r.lon,0)/rs.length],src:'GPS aset'};
  if(WS.ready){const w=V().find(r=>r.kib&&r.opd===n&&r.wKode);if(w){const e=WS.byK.get(w.wKode),k=e&&(e.l>=3?e.kec:e.k),c=k&&wilCoord(k,[]);if(c)return{c:c.c,src:'perkiraan wilayah',approx:1}}}
  return null;
}
function jdBuild(a){
  const m=new Map();
  a.forEach(r=>{const o=r.opd||'(Belum terkelompok)';if(!m.has(o))m.set(o,{opd:o,n:{A:0,B:0,C:0,D:0,E:0,F:0},rows:[],al:new Map()});
    const x=m.get(o);x.n[r.kib]++;x.rows.push(r);const al=String(r.alamat||'').trim();if(al&&!adrEmpty(al))x.al.set(al,(x.al.get(al)||0)+1)});
  return[...m.values()].sort((x,y)=>x.opd.localeCompare(y.opd));
}
function jdRows(){
  const ks=[...JD.kibs];if(!ks.length)return[];
  let a=V().filter(r=>r.kib&&r.st==='01'&&!r.mut&&ks.includes(r.kib));
  if(JD.gs.length)a=a.filter(r=>JD.gs.some(g=>(r.wGid||[]).includes(g)));
  if(JD.wts.length)a=a.filter(r=>JD.wts.some(t=>wMatch(r,t)));
  return jdBuild(a);
}
const jdX=o=>jdBuild(V().filter(r=>r.kib&&r.st==='01'&&!r.mut&&JD.kibs.has(r.kib)&&(r.opd||'(Belum terkelompok)')===o))[0]||{opd:o,n:{A:0,B:0,C:0,D:0,E:0,F:0},rows:[],al:new Map()};
function jdCo(x){
  if(JD.wts.length||JD.gs.length){
    const g=x.rows.filter(r=>r.lat!=null&&r.lat!==''&&!isNaN(+r.lat));
    if(g.length)return{c:[g.reduce((s,r)=>s+ +r.lat,0)/g.length,g.reduce((s,r)=>s+ +r.lon,0)/g.length],src:'GPS aset di daerah ini'};
    if(WS.ready){const kc=new Map();x.rows.forEach(r=>{const e=WS.byK.get(r.wKode);if(e){const k=e.l>=3?e.kec:e.k;kc.set(k,(kc.get(k)||0)+1)}});
      const top=[...kc].sort((a,b)=>b[1]-a[1])[0];if(top){const c=wilCoord(top[0],x.rows);if(c)return{c:c.c,src:'perkiraan daerah ('+c.src+')',approx:1}}}
  }
  return opdCoord(x.opd);
}
const jdLok=x=>{const t=[...x.al].sort((a,b)=>b[1]-a[1])[0];return t?t[0]:''};
const jdArea=()=>JD.wts.join(', ')||JD.gs.map(id=>(wgs().find(g=>g.id===id)||{}).name).filter(Boolean).join(', ');
const inCart=o=>JD.cart.some(c=>c.opd===o);

function jdPhone(){
  const el=$('#jphone');if(!el)return;const ks=kts();
  el.innerHTML=`<button class="b sm" data-a="kedit" data-id="">+ Kontak baru</button>`+JD.cps.map(id=>ks.find(k=>k.id===id)).filter(Boolean).map(c=>`<button class="b sm" data-a="kedit" data-id="${c.id}">✏️ ${esc(c.nama)}</button>${c.hp?`<a class="b sm" href="tel:${esc(c.hp)}">📞 ${esc(c.hp)}</a>`:''}`).join('');
}
document.addEventListener('change',e=>{
  const t=e.target;if(!t.closest)return;
  if(t.closest('#jdform')){
    if(t.id==='jdt')JD.date=t.value||JD.date;else if(t.id==='jtim')JD.tim=t.value;
    else if(t.dataset.jk){t.checked?JD.kibs.add(t.dataset.jk):JD.kibs.delete(t.dataset.jk);JD.pg=1;jdList();jdCart();jdDraw(1)}
  }else if(t.closest('#jdlist')&&t.dataset.jo!==undefined)jdToggle(t.dataset.jo,t.checked);
  else if(t.closest('#jdcart')){
    if(t.dataset.cd){const o=t.dataset.cd,n=t.value;if(!n)return;JD.cart.forEach(c=>{if(c.date===o)c.date=n});if(JD.cur===o)JD.cur=n;jdCart();jdDraw()}
    else if(t.dataset.ct)JD.cart.forEach(c=>{if(c.date===t.dataset.ct)c.tim=t.value});
  }
});
function jdToggle(o,on){
  if(on===undefined)on=!inCart(o);
  if(on&&!inCart(o)){JD.cart.push({opd:o,date:JD.date||addDays(1),tim:JD.tim,co:jdCo(jdRows().find(x=>x.opd===o)||jdX(o))});JD.cur=JD.date||addDays(1)}
  if(!on)JD.cart=JD.cart.filter(c=>c.opd!==o);
  jdList();jdCart();jdDraw();
}
function jdList(){
  const el=$('#jdlist');if(!el)return;const rows=jdRows(),ks=[...JD.kibs],N=pgN()*JD.pg;
  el.innerHTML=`<div class="bar"><h3 style="margin:0">Instansi (${rows.length})</h3><span class="row" style="margin:0">${psel()}<button class="b sm" data-a="jdall">Centang semua</button><button class="b sm" data-a="jdnone">Kosongkan</button></span></div>`
   +(rows.slice(0,N).map(x=>{const co=jdCo(x),on=inCart(x.opd);
     return `<div class="ig"><label class="iv-r"><input type="checkbox" data-jo="${esc(x.opd)}"${on?' checked':''}><span><b>${esc(x.opd)}</b> ${ks.map(k=>`<i class="ch">${k}: ${x.n[k]}</i>`).join('')}<small>${esc(jdLok(x)||'Lokasi belum terisi')} · ${co?(co.approx?co.src:co.src)+` · <a href="https://www.google.com/maps?q=${co.c[0]},${co.c[1]}" target="_blank" rel="noopener">Google Maps</a>`:'koordinat belum ada'}</small></span></label></div>`}).join('')||'<p class="empty">Tidak ada instansi dengan data pada KIB dan area ini.</p>')
   +(rows.length>N?`<div class="row"><button class="b" data-a="jdmore">Tampilkan lebih banyak</button></div>`:'');
}
A.jdmore=()=>{JD.pg++;jdList()};
A.jdall=()=>{jdRows().forEach(x=>{if(!inCart(x.opd))JD.cart.push({opd:x.opd,date:JD.date,tim:JD.tim,co:jdCo(x)})});JD.cur=JD.date;jdList();jdCart();jdDraw()};
A.jdnone=()=>{JD.cart=[];jdList();jdCart();jdDraw()};
A.jdrm=t=>jdToggle(t.dataset.o,false);
A.jdclear=()=>{if(JD.cart.length&&!confirm('Kosongkan keranjang?'))return;JD.cart=[];JD.edit='';jdList();jdCart();jdDraw()};
A.jdshow=t=>{JD.cur=t.dataset.d;jdCart();jdDraw()};
A.jdsort=()=>{
  const cs=JD.cart.filter(c=>c.date===JD.cur),pts=cs.map(c=>({c,co:(c.co||opdCoord(c.opd))}));
  if(pts.filter(p=>p.co).length<2)return toast('Perlu minimal 2 instansi berkoordinat','w');
  const rest=pts.slice(),out=[rest.shift()];
  while(rest.length){const l=out[out.length-1];let bi=0,bd=1e18;rest.forEach((p,i)=>{const d=l.co&&p.co?wDist(l.co.c[0],l.co.c[1],p.co.c[0],p.co.c[1]):1e17;if(d<bd){bd=d;bi=i}});out.push(rest.splice(bi,1)[0])}
  JD.cart=[...JD.cart.filter(c=>c.date!==JD.cur),...out.map(p=>p.c)];jdCart();jdDraw();
};
function jdCart(){
  const el=$('#jdcart');if(!el)return;
  if(!JD.cart.length){el.innerHTML='';jdSuggest();return}
  const R=new Map(jdRows().map(x=>[x.opd,x])),g=new Map();JD.cart.forEach(c=>{if(!g.has(c.date))g.set(c.date,[]);g.get(c.date).push(c)});
  el.innerHTML=`<div class="pn"><h3>Keranjang jadwal</h3>${[...g].sort((a,b)=>a[0]<b[0]?-1:1).map(([d,cs])=>`<div class="qf"><div class="row"><b style="flex:1;min-width:150px">${fdl(d)}</b><input type="date" data-cd="${d}" value="${d}" style="width:auto"></div>
    <div class="row"><input data-ct="${d}" value="${esc(cs[0].tim)}" placeholder="Tim" style="width:110px"><button class="b sm${JD.cur===d?' p':''}" data-a="jdshow" data-d="${d}">🧭 Tampilkan rute</button></div>
    ${cs.map((c,i)=>{const x=R.get(c.opd)||jdX(c.opd);return `<div class="cd" style="cursor:default"><b>${i+1}. ${esc(c.opd)}</b> <i class="ch">${[...JD.kibs].map(k=>k+': '+(x.n[k]||0)).join(' · ')}</i><button class="ib" style="float:right" data-a="jdrm" data-o="${esc(c.opd)}" title="Keluarkan">✕</button></div>`}).join('')}</div>`).join('')}
    <div class="row"><button class="b p" data-a="jdsave">${JD.edit?'💾 Perbarui jadwal':'💾 Simpan jadwal'}</button><button class="b" data-a="jdsort">↕ Urutkan terdekat</button><button class="b" data-a="jdoff">⬇ Unduh rute offline</button><button class="b d" data-a="jdclear">Kosongkan</button></div></div>`;
  jdSuggest();
}
function jdSuggest(){
  const el=$('#jdsug');if(!el)return;
  if(!JD.cart.length){el.innerHTML='';return}
  const regs=new Set();
  JD.cart.forEach(c=>{const x=jdRows().find(r=>r.opd===c.opd)||jdX(c.opd);x.rows.forEach(r=>{if(r.wKec)regs.add(r.wKec)})});
  if(!regs.size){el.innerHTML='';return}
  const ks=[...JD.kibs],m=new Map();
  V().filter(r=>r.kib&&r.st==='01'&&!r.mut&&ks.includes(r.kib)&&regs.has(r.wKec)&&!inCart(r.opd||'(Belum terkelompok)')).forEach(r=>{const o=r.opd||'(Belum terkelompok)';if(!m.has(o))m.set(o,[]);m.get(o).push(r)});
  const L=[...m].sort((a,b)=>b[1].length-a[1].length).slice(0,15);
  el.innerHTML=L.length?`<div class="pn"><h3>Instansi lain di daerah yang sama</h3><p class="mu">Daerah: ${[...regs].slice(0,6).map(esc).join(', ')}. Instansi berikut juga punya aset di sana, jadi bisa sekalian dikunjungi.</p>${L.map(([o,rs])=>`<div class="ig"><div class="iv-g" style="cursor:default"><b>${esc(o)}</b><i class="ch">${rs.length} data</i><button class="b sm" data-a="jdsug" data-o="${esc(o)}">+ Tambah</button></div></div>`).join('')}</div>`:'';
}
A.jdsug=t=>{const o=t.dataset.o,regs=new Set();JD.cart.forEach(c=>{const x=jdRows().find(r=>r.opd===c.opd)||jdX(c.opd);x.rows.forEach(r=>{if(r.wKec)regs.add(r.wKec)})});
  const rows=V().filter(r=>r.kib&&r.st==='01'&&!r.mut&&JD.kibs.has(r.kib)&&regs.has(r.wKec)&&(r.opd||'(Belum terkelompok)')===o),x=jdBuild(rows)[0];
  if(!x)return;JD.cart.push({opd:o,date:JD.cur||JD.date,tim:JD.tim,co:jdCo({...x,rows:x.rows})||opdCoord(o)});jdList();jdCart();jdDraw()};

/* --- peta + rute --- */
let JM=null,JL=null;
async function jdMapInit(){
  const el=$('#jmap');if(!el)return;
  try{
    if(!document.getElementById('lcss')){const l=document.createElement('link');l.id='lcss';l.rel='stylesheet';l.href=LCSS;document.head.append(l)}
    await js(LJS);
  }catch(_){el.innerHTML='<p class="empty">Peta perlu internet saat pertama dibuka.</p>';return}
  if(JM){try{JM.remove()}catch(_){}}
  JM=L.map(el).setView([-0.8,127.6],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM'}).addTo(JM);
  JL=L.layerGroup().addTo(JM);setTimeout(()=>JM&&JM.invalidateSize(),250);jdDraw(1);
}
async function jdDraw(fit){
  if(!JM||!JL||!$('#jmap'))return;
  JL.clearLayers();const pts=[];
  jdRows().forEach(x=>{const co=jdCo(x);if(!co)return;const on=inCart(x.opd);pts.push(co.c);
    L.circleMarker(co.c,{radius:on?10:6,color:on?'#e8761f':'#3b1f14',weight:2,fillColor:on?'#fbc531':'#2fa66a',fillOpacity:.9}).addTo(JL).bindTooltip(x.opd+(co.approx?' (perkiraan)':'')).on('click',()=>jdToggle(x.opd))});
  if(fit&&pts.length)JM.fitBounds(pts,{padding:[24,24],maxZoom:12});
  await jdRoute();
}
const rkey=(a,b)=>a.map(x=>(+x).toFixed(4)).join(',')+'|'+b.map(x=>(+x).toFixed(4)).join(',');
function decPoly(s){let i=0,la=0,lo=0,o=[];while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);la+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lo+=(r&1)?~(r>>1):(r>>1);o.push([la/1e5,lo/1e5])}return o}
let rtT;const rtSave=()=>{clearTimeout(rtT);rtT=setTimeout(()=>kv('routes',D.routes),800)};
function rtTrim(){const rc=D.routes,ks=Object.keys(rc);if(ks.length>200){ks.sort((a,b)=>(rc[a].t||0)-(rc[b].t||0)).slice(0,ks.length-200).forEach(k=>delete rc[k])}}
async function routeLeg(a,b,noNet){
  const rc=D.routes||(D.routes={}),k=rkey(a,b),h=rc[k];
  if(h){h.t=Date.now();return{line:decPoly(h.p),km:h.d/1000,min:h.s/60,steps:h.st||[],src:'cache'}}
  if(!noNet&&navigator.onLine){
    try{
      const u=`${D.meta.osrm||'https://router.project-osrm.org'}/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=simplified&geometries=polyline&steps=true`,
            ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000),r=await fetch(u,{signal:ctl.signal});clearTimeout(tm);
      const j=await r.json();
      if(j.code==='Ok'&&j.routes&&j.routes[0]){
        const x=j.routes[0],st=((x.legs[0]||{}).steps||[]).map(s=>[s.name||'',s.maneuver.type,s.maneuver.modifier||'',Math.round(s.distance)]);
        rc[k]={p:x.geometry,d:Math.round(x.distance),s:Math.round(x.duration),st,t:Date.now()};rtTrim();rtSave();
        return{line:decPoly(x.geometry),km:x.distance/1000,min:x.duration/60,steps:st,src:'online'};
      }
    }catch(_){}
  }
  const d=wDist(a[0],a[1],b[0],b[1])/1000;return{line:[a,b],km:d,min:d/40*60,steps:[],src:'lurus'};
}
async function jdRoute(){
  const tok=JD.tok=Math.random(),rs=$('#jrs'),cs=JD.cart.filter(c=>c.date===JD.cur);
  const pts=cs.map(c=>({o:c.opd,co:(c.co||opdCoord(c.opd))})).filter(p=>p.co);JD.route=null;
  if(pts.length<2){if(rs)rs.textContent=cs.length?'Centang minimal 2 instansi yang punya koordinat untuk melihat rute.':'Centang instansi untuk menandai di peta dan membuat rute.';return}
  let km=0,min=0,off=0,lurus=0;const steps=[];
  for(let i=0;i<pts.length-1;i++){
    const r=await routeLeg(pts[i].co.c,pts[i+1].co.c);if(tok!==JD.tok)return;
    if(JL&&window.L)L.polyline(r.line,{color:r.src==='lurus'?'#8a7262':'#e8761f',weight:5,opacity:.85,dashArray:r.src==='lurus'?'6 8':null}).addTo(JL);
    km+=r.km;min+=r.min;if(r.src==='cache')off++;if(r.src==='lurus')lurus++;steps.push({a:pts[i].o,b:pts[i+1].o,r});
  }
  JD.route={km,min,steps};
  if(rs)rs.innerHTML=`Rute ${fdl(JD.cur)}: <b>${km.toFixed(1)} km</b> · ±${fmtMin(min)} · ${off} dari ${pts.length-1} ruas tersimpan offline${lurus?` · garis putus-putus = ${lurus} ruas perkiraan garis lurus (rute jalan belum tersedia)`:''} <button class="b sm" data-a="jdsteps">Petunjuk arah</button>`;
}
const MN={'turn':'Belok','new name':'Lanjut','depart':'Mulai','arrive':'Tiba','merge':'Bergabung','on ramp':'Masuk jalur','off ramp':'Keluar jalur','fork':'Ambil percabangan','end of road':'Belok','continue':'Lurus','roundabout':'Masuk bundaran','rotary':'Masuk bundaran','roundabout turn':'Belok di bundaran'};
const MD={'left':'kiri','right':'kanan','slight left':'serong kiri','slight right':'serong kanan','sharp left':'tajam kiri','sharp right':'tajam kanan','straight':'lurus','uturn':'putar balik'};
const stepTx=([n,t,m,d])=>`${MN[t]||'Lanjut'}${m&&MD[m]&&t!=='depart'&&t!=='arrive'?' '+MD[m]:''}${n?' ke '+n:''} (${d>=1000?(d/1000).toFixed(1)+' km':d+' m'})`;
A.jdsteps=()=>{
  if(!JD.route)return;
  modal(`<h3>Petunjuk arah</h3><div style="max-height:62vh;overflow:auto">${JD.route.steps.map((s,i)=>`<h4>${i+1}. ${esc(s.a)} ke ${esc(s.b)}</h4><p class="mu" style="margin:0">${s.r.km.toFixed(1)} km · ±${fmtMin(s.r.min)} · ${s.r.src==='lurus'?'perkiraan garis lurus':s.r.src==='cache'?'tersimpan offline':'baru diunduh'}</p>${s.r.steps.length?`<ol style="margin:4px 0 10px 18px;padding:0">${s.r.steps.map(x=>`<li>${esc(stepTx(x))}</li>`).join('')}</ol>`:''}`).join('')}</div><div class="row"><button class="b p" data-a="close">Tutup</button></div>`);
};
async function prefetchPlans(show){
  if(!navigator.onLine||prefetchPlans.run)return 0;prefetchPlans.run=1;let n=0;
  try{
    for(const p of planes().filter(p=>planAct(p)&&dTo(p.date)>=-1&&dTo(p.date)<=21)){
      const pts=(p.items||[]).map(i=>i.lat!=null&&i.lon!=null?[i.lat,i.lon]:null).filter(Boolean);
      for(let i=0;i<pts.length-1;i++){if((D.routes||{})[rkey(pts[i],pts[i+1])])continue;const r=await routeLeg(pts[i],pts[i+1]);if(r.src==='online')n++;await new Promise(x=>setTimeout(x,350))}
    }
  }finally{prefetchPlans.run=0}
  if(n||show)toast(n?`${n} ruas rute diunduh untuk dipakai offline`:'Semua rute jadwal sudah tersimpan offline','ok',3500);return n;
}
A.jdoff=()=>{
  if(!navigator.onLine)return toast('Perlu internet untuk mengunduh rute','w');

const PS={};
function pulses(){
  document.querySelectorAll('.pulse').forEach(e=>e.classList.remove('pulse'));
  const trig=new Set(),base=V().filter(r=>r.kib&&r.st==='01');let nx=1e9;
  const on=sel=>{trig.add(sel);const t0=PS[sel]||(PS[sel]=Date.now()),left=30000-(Date.now()-t0);if(left<=0)return;nx=Math.min(nx,left);document.querySelectorAll(sel).forEach(e=>e.classList.add('pulse'))};
  if(QN||needSetup())on('[data-a=tab][data-k=sinkron]');
  if(QN)on('#qc,[data-a=kirim]');
  if(needSetup())on('[data-a=msave],[data-a=gosync]');
  if(!base.length)on('[data-a=tab][data-k=data]');
  if(G.dirty.size)on('[data-a=gsave]');
  if(planes().some(p=>planAct(p)&&p.date<=today()))on('[data-a=tab][data-k=inv],[data-a=tab][data-k=jadwal]');
  if(S.tab==='data'&&G.rows&&G.rows.some(r=>!r.wKode&&(r.alamat||r.ket))&&WS.ready)on('[data-a=wquick]');
  if(S.tab==='data'&&!base.length)on('[data-a=imp]');
  Object.keys(PS).forEach(k=>{if(!trig.has(k))delete PS[k]});
  clearTimeout(pulses._t);if(nx<1e9)pulses._t=setTimeout(pulses,nx+120);
}

/* --- Isi lapangan: GPS otomatis --- */
function ivGps(force){
  const e=$('#ivgps');if(!e)return;
  const show=p=>{const x=$('#ivgps');if(x)x.innerHTML=p?`📍 Lintang <b>${p.lat.toFixed(6)}</b> · Bujur <b>${p.lon.toFixed(6)}</b> <span class="mu">(±${Math.round(p.acc)} m)</span>`:'📍 Lokasi belum tersedia. Aktifkan GPS lalu ketuk Ambil ulang'};
  if(!force&&IV.pos&&Date.now()-IV.pos.t<60000){show(IV.pos);return}
  if(!navigator.geolocation){show(null);return}
  e.textContent='📍 Mengambil lokasi…';
  navigator.geolocation.getCurrentPosition(p=>{IV.pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};show(IV.pos)},()=>show(null),{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}

const SD=5000,MDC={};

const mlab=(c,v)=>{const o=c.opts.find(x=>x[0]===v);return o?o[1]:v};
const mddB=id=>{const c=MDC[id];return `<div class="mdd-b">${c.sel.map(v=>`<i class="ch">${esc(mlab(c,v))} <b data-mx="${esc(v)}">×</b></i>`).join('')}<input class="mdd-i" placeholder="${c.sel.length?'tambah…':esc(c.ph)}" autocomplete="off" enterkeyhint="done"></div>`};
function mdd(id,ph,opts,sel,on,o={}){MDC[id]={ph,opts,sel:[...sel],on,free:!!o.free,single:!!o.single,focus:o.focus,t:0};return `<div class="mdd" data-md="${id}">${mddB(id)}<div class="mdd-l" hidden></div></div>`}
function mddList(el,txt){
  const c=MDC[el.dataset.md];if(!c)return;const l=el.querySelector('.mdd-l'),q=wn(txt||''),os=c.opts.filter(o=>!q||wn(o[1]).includes(q)).slice(0,80);
  l.innerHTML=os.map(o=>`<div class="mdd-o${c.sel.includes(o[0])?' on':''}" data-mv="${esc(o[0])}">${c.sel.includes(o[0])?'✓ ':''}${esc(o[1])}</div>`).join('')||`<div class="mdd-o mu">${c.free&&txt?'Enter untuk menambah “'+esc(txt)+'”':'Tidak ada pilihan'}</div>`;
  l.hidden=false;mddPos(el);
}
function mddPos(el){const l=el.querySelector('.mdd-l'),b=el.querySelector('.mdd-b');if(!l||l.hidden||!b)return;const r=b.getBoundingClientRect(),h=Math.max(120,Math.min(260,innerHeight-r.bottom-14));l.style.cssText=`position:fixed;left:${r.left}px;top:${r.bottom+4}px;width:${r.width}px;max-height:${h}px;right:auto;margin:0`}
const mddRe=()=>document.querySelectorAll('.mdd').forEach(mddPos);
addEventListener('resize',mddRe);document.addEventListener('scroll',e=>{if(!(e.target.closest&&e.target.closest('.mdd-l')))mddRe()},true);
function mddSet(el,sel,keep){
  const id=el.dataset.md,c=MDC[id];c.sel=c.single?sel.slice(-1):sel;
  el.querySelector('.mdd-b').outerHTML=mddB(id);
  const i=el.querySelector('.mdd-i');if(keep){i.focus()}
  if(c.single)el.querySelector('.mdd-l').hidden=true;
  c.on&&c.on([...c.sel]);

function mddArm(el){
  const c=MDC[el.dataset.md];clearTimeout(c.t);
  c.t=setTimeout(()=>{
    const i=el.querySelector('.mdd-i'),v=i&&i.value.trim();
    if(v&&c.free&&!c.sel.includes(v)){i.value='';mddSet(el,[...c.sel,v],0)}
    const l=el.querySelector('.mdd-l');if(l)l.hidden=true;if(i&&document.activeElement===i)i.blur();
  },SD);
}
const mddEl=t=>t.closest&&t.closest('.mdd');
document.addEventListener('focusin',e=>{const el=mddEl(e.target);if(!el||!e.target.classList.contains('mdd-i'))return;const c=MDC[el.dataset.md];c&&c.focus&&c.focus(c);mddList(el,e.target.value);mddArm(el)});

let BRI=null;
function briBuild(){BRI=new Map();BRI.n=brg().length;brg().forEach(b=>{if(String(b.k).split('.').length<4)return;const k=wn(b.u);if(!BRI.has(k))BRI.set(k,[]);BRI.get(k).push(b.k)})}
function kodeFor(n){if(!BRI||BRI.n!==brg().length)briBuild();const l=BRI.get(wn(n));return l&&l.length?[...l].sort((a,b)=>a.length-b.length)[0]:''}
function brgDL(){const seen=new Set(),o=[];for(const b of brg()){if(String(b.k).split('.').length<4||seen.has(b.u))continue;seen.add(b.u);o.push(`<option value="${esc(b.u)}">`);if(o.length>=3000)break}return `<datalist id="brgl">${o.join('')}</datalist>`}

/* ======================= IMPORT EXCEL JADWAL (format lampiran) ======================= */
const BLNI={januari:0,jan:0,februari:1,feb:1,maret:2,mar:2,april:3,apr:3,mei:4,juni:5,jun:5,juli:6,jul:6,agustus:7,agt:7,agu:7,september:8,sep:8,oktober:9,okt:9,november:10,nov:10,desember:11,des:11};
function idDate(v){
  if(isD(v))return iso(v);
  if(typeof v==='number'&&v>20000&&v<80000)return dt(v);
  const m=String(v||'').toLowerCase().match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
  if(m&&BLNI[m[2]]!=null)return `${m[3]}-${String(BLNI[m[2]]+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const d=dt(v);return /^\d{4}-\d\d-\d\d$/.test(d)?d:'';
}
async function readAllSheets(f){await js(XJS);const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}))}
function matchOpd(n){
  const c=canonOpd(n);if(c)return c;
  const k=opdKey(n).replace(/ /g,'');let best=null;
  for(const nm of opdNames()){const b=opdKey(nm).replace(/ /g,''),L=Math.max(k.length,b.length),mx=L<12?1:L<25?2:3;
    if(k===b)return nm;if(k.length>5&&digs(k)===digs(b)){const d=dl(k,b,mx);if(d<=mx&&(!best||d<best.d))best={n:nm,d}}}
  return best?best.n:null;
}
function parseJadwal(sheets){
  const plans=new Map(),unm=new Set();
  for(const sh of sheets){
    const hi=sh.rows.findIndex(r=>r.some(c=>nh(c)==='upb'));if(hi<0)continue;
    const H=sh.rows[hi].map(nh),ix=re=>H.findIndex(h=>re.test(h)),kets=H.map((h,i)=>/^keterangan/.test(h)?i:-1).filter(i=>i>=0);
    const cd=ix(/hari|tanggal/),cu=ix(/^upb$/),ck=kets[0],ct=kets[1],cl=ix(/lokasi/),cA=ix(/tanah/),cC=ix(/bangunan/),cF=ix(/^kdp$/),cp=ix(/contact|kontak/),cB=ix(/peralatan/),cD=ix(/jalan/),cE=ix(/lainnya/);
    let date='',cpTxt='',last='';
    for(let i=hi+1;i<sh.rows.length;i++){
      const r=sh.rows[i],d=cd>=0?idDate(r[cd]):'';if(d)date=d;
      const upb=tx_(r[cu]);if(!upb||!date)continue;
      const tim=(ct>=0&&tx_(r[ct]))||'TIM 1',key=date+'|'+tim;
      if(key!==last){cpTxt='';last=key}
      const cpv=cp>=0?tx_(r[cp]):'';let note='';
      if(cpv){if(/\d[\d\s().-]{7,}/.test(cpv))cpTxt=cpv;else note=cpv}
      const kt=ck>=0?tx_(r[ck]):'',nn=c=>c>=0?(numv(r[c])||0):0,n={A:nn(cA),B:nn(cB),C:nn(cC),D:nn(cD),E:nn(cE),F:nn(cF)};
      let kl=[...new Set((kt.match(/KIB\s*([A-F])/gi)||[]).map(x=>x.slice(-1).toUpperCase()))];if(!kl.length)kl=Object.keys(n).filter(k=>n[k]>0);
      const o=matchOpd(upb);if(!o)unm.add(upb);
      if(!plans.has(key))plans.set(key,{date,tim,cp:'',items:[],kibs:new Set(),wil:'',notes:[]});
      const P=plans.get(key);if(cpTxt)P.cp=cpTxt;if(!P.wil&&cl>=0)P.wil=tx_(r[cl]);if(note)P.notes.push(note);
      kl.forEach(k=>P.kibs.add(k));P.items.push({opd:o||upb,raw:upb,ok:!!o,tim,n,kibs:kl,lokasi:cl>=0?tx_(r[cl]):''});
    }
  }
  return{plans:[...plans.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.tim<b.tim?-1:1),unm:[...unm]};
}
A.jdimp=()=>pickFile('.xlsx,.xls',f=>busy('Membaca jadwal…',async()=>{
  const P=parseJadwal(await readAllSheets(f));
  if(!P.plans.length)return toast('Tidak ada baris jadwal. Pastikan baris judul memuat kolom UPB dan HARI dan TANGGAL','w',9000);
  JD.imp=P;
  modal(`<h3>Pratinjau import jadwal</h3><p class="mu">${P.plans.length} jadwal, ${P.plans.reduce((s,p)=>s+p.items.length,0)} baris instansi.${P.unm.length?` <b style="color:var(--er)">${P.unm.length} nama instansi tidak ditemukan di data</b> (tetap diimpor, tapi tanpa daftar aset): ${P.unm.slice(0,6).map(esc).join('; ')}${P.unm.length>6?'…':''}`:' Semua instansi cocok dengan data.'}</p>
    <div style="max-height:46vh;overflow:auto"><table><tr><th>Tanggal</th><th>Tim</th><th>Instansi</th><th>Contact</th></tr>${P.plans.map(p=>`<tr><td>${fdl(p.date)}</td><td>${esc(p.tim)}</td><td>${p.items.length}: ${p.items.slice(0,3).map(i=>esc(i.opd)).join(', ')}${p.items.length>3?'…':''}</td><td>${esc(p.cp||'-')}</td></tr>`).join('')}</table></div>
    <div class="row"><button class="b p" data-a="jdimpGo">Simpan jadwal</button><button class="b" data-a="close">Batal</button></div>`);
}));
A.jdimpGo=async()=>{
  const P=JD.imp;if(!P)return;if(!confirm(`Simpan ${P.plans.length} jadwal hasil import?`))return;
  let made=0,skip=0;hb();
  for(const g of P.plans){
    const names=g.items.map(i=>i.opd).sort().join('|');
    if(planes().some(p=>p.date===g.date&&(p.tim||'')===g.tim&&(p.items||[]).map(i=>i.opd).sort().join('|')===names)){skip++;continue}
    let cpids=[],cpx=g.cp,cn='',hp='';
    if(g.cp){const m=g.cp.match(/^(.*?)\s*\(([^)]*)\)\s*$/);cn=(m?m[1]:g.cp).trim();hp=(m?m[2]:(g.cp.match(/\+?\d[\d\s().-]{7,}/)||[''])[0]).trim();
      const dg=hp.replace(/\D/g,''),ex=kts().find(k=>(dg&&String(k.hp).replace(/\D/g,'')===dg)||wn(k.nama)===wn(cn));
      if(ex)cpids=[ex.id];else if(cn){const k={id:uid(),nama:cn,hp,ket:'dari import jadwal'};kts().push(k);cpids=[k.id];await kv('kontak',kts())}}
    const items=g.items.map(i=>{const co=i.ok?opdCoord(i.opd):null;return{opd:i.opd,tim:i.tim,n:i.n,lokasi:i.lokasi,lat:co?co.c[0]:null,lon:co?co.c[1]:null}});
    const ks=[...g.kibs].sort();
    const ids=[...new Set(g.items.filter(i=>i.ok).flatMap(i=>V().filter(r=>r.kib&&r.st==='01'&&!r.mut&&r.opd===i.opd&&(i.kibs.length?i.kibs:ks).includes(r.kib)&&!r.invAt&&(!r.ada||r.ada==='BELUM')).map(r=>r.id)))];
    const p={id:uid(),st:'plan'};hn(p,1);
    Object.assign(p,{name:`Inventarisasi ${g.wil||'lapangan'}`,date:g.date,tim:g.tim,cp:cn,hp,cpx,cpids,wil:g.wil,kibs:ks,items,ids,note:g.notes.join('; '),petugas:D.meta.who||'',fields:QDEF});
    await save(p);made++;
  }
  hc();JD.imp=null;A.close();toast(`${made} jadwal diimpor${skip?`, ${skip} dilewati karena sudah ada`:''}`,'ok',6000);if(S.tab==='jadwal')jdSaved();prefetchPlans();
};
